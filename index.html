<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONQA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            font-size: 42px;
            color: #d4af37;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 15px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 20px;
        }

        .product img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .product h3 {
            margin: 15px 5px 8px;
            font-size: 20px;
        }

        .product p {
            color: #666;
            margin-bottom: 15px;
        }

        .contact {
            text-align: center;
            margin-top: 40px;
            padding: 35px 15px;
            background: #111;
            color: white;
            border-radius: 15px;
        }

        .contact h2 {
            margin-bottom: 10px;
        }

        .phone,
        .whatsapp {
            display: inline-block;
            margin: 15px 5px;
            padding: 13px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .phone {
            background: #d4af37;
            color: #111;
        }

        .whatsapp {
            background: #25D366;
            color: white;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>RONQA</h1>
    <p>منتجات مميزة بأسعار مناسبة</p>
</header>

<div class="container">

    <div class="products">

        <div class="product">
            <img src="images/product1.jpg" alt="منتج RONQA">
            <h3>المنتج الأول</h3>
            <p>السعر: 1500 دج</p>
        </div>

        <div class="product">
            <img src="images/product2.jpg" alt="منتج RONQA">
            <h3>المنتج الثاني</h3>
            <p>السعر: 1800 دج</p>
        </div>

        <div class="product">
            <img src="images/product3.jpg" alt="منتج RONQA">
            <h3>المنتج الثالث</h3>
            <p>السعر: 2000 دج</p>
        </div>

    </div>

    <div class="contact">
        <h2>للطلب والاستفسار</h2>
        <p>تواصل معنا مباشرة</p>

        <a class="phone" href="tel:+213675996957">
            📞 0675996957
        </a>

        <a class="whatsapp"
           href="https://wa.me/213675996957"
           target="_blank">
            💬 WhatsApp
        </a>
    </div>

</div>

<footer>
    © 2026 RONQA - جميع الحقوق محفوظة
</footer>

</body>
</html>
