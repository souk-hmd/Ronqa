<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RONQA | متجر إلكتروني</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f7f7f7;
color:#222;
}


/* HEADER */

header{
background:#111;
color:white;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 15px rgba(0,0,0,.25);
}

.header-content{
max-width:1150px;
margin:auto;
padding:15px 18px;
display:flex;
align-items:center;
justify-content:space-between;
}


/* LOGO */

.logo{
text-align:center;
line-height:1;
}

.logo-main{
font-size:34px;
font-weight:bold;
letter-spacing:5px;
color:#d4af37;
}

.logo-sub{
font-size:10px;
letter-spacing:3px;
color:#ddd;
margin-top:5px;
}


/* CART BUTTON */

.cart-button{
background:#d4af37;
color:#111;
border:0;
padding:11px 17px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

.cart-count{
background:#111;
color:#d4af37;
padding:2px 6px;
border-radius:50%;
margin-right:4px;
}


/* HERO */

.hero{
background:#111;
color:white;
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:42px;
color:#d4af37;
letter-spacing:5px;
margin-bottom:12px;
}

.hero p{
font-size:18px;
color:#ddd;
}


/* CONTAINER */

.container{
max-width:1150px;
margin:auto;
padding:30px 15px;
}


/* SEARCH */

.search-box{
margin-bottom:30px;
}

.search-box input{
width:100%;
padding:15px 18px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
}

.search-box input:focus{
border-color:#d4af37;
}


/* TITLE */

.title{
text-align:center;
font-size:28px;
margin-bottom:25px;
}


/* PRODUCTS */

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:22px;
}

.product{
background:white;
border-radius:16px;
padding:15px;
box-shadow:
0 4px 18px rgba(0,0,0,.08);
transition:.2s;
}

.product:hover{
transform:translateY(-4px);
}


/* IMAGE */

.product-image{
width:100%;
height:230px;
background:#f0f0f0;
border-radius:12px;
overflow:hidden;
margin-bottom:15px;
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.no-image{
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
font-size:55px;
}


/* PRODUCT INFO */

.product h3{
font-size:20px;
margin-bottom:8px;
}

.product-description{
color:#777;
min-height:38px;
margin-bottom:10px;
}

.price{
color:#b08b00;
font-size:21px;
font-weight:bold;
margin-bottom:8px;
}

.stock{
font-size:14px;
color:#555;
margin-bottom:13px;
}


/* ADD BUTTON */

.add-cart{
width:100%;
border:0;
background:#111;
color:white;
padding:13px;
border-radius:9px;
font-weight:bold;
cursor:pointer;
font-size:14px;
}

.add-cart:hover{
background:#d4af37;
color:#111;
}

.add-cart:disabled{
background:#aaa;
cursor:not-allowed;
}


/* CART */

.cart{
position:fixed;
top:0;
left:-100%;
width:100%;
max-width:430px;
height:100%;
background:white
