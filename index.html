<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RONQA</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#f6f6f6;
color:#222
}

header{
background:#111;
color:#fff;
padding:15px;
position:sticky;
top:0;
z-index:100
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
color:#d4af37;
font-size:30px;
font-weight:bold;
letter-spacing:5px
}

.cart-button{
background:#d4af37;
border:0;
padding:11px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer
}

.hero{
background:#111;
color:#fff;
text-align:center;
padding:40px 15px
}

.hero h1{
color:#d4af37;
font-size:40px;
letter-spacing:6px;
margin-bottom:10px
}

.container{
max-width:1100px;
margin:auto;
padding:25px 15px
}

.search input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
margin-bottom:18px;
outline:none
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:20px
}

.category{
background:#fff;
border:1px solid #ddd;
padding:11px 20px;
border-radius:25px;
font-weight:bold;
white-space:nowrap;
cursor:pointer
}

.category.active{
background:#111;
color:#d4af37
}

.title{
text-align:center;
margin-bottom:22px
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px
}

.product{
background:#fff;
border-radius:15px;
padding:14px;
box-shadow:0 4px 15px rgba(0,0,0,.08)
}

.product-image{
height:220px;
background:#eee;
border-radius:12px;
overflow:hidden;
margin-bottom:13px
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
display:block
}

.no-image{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px
}

.product h3{
margin-bottom:7px
}

.description{
color:#777;
margin-bottom:8px
}

.price{
color:#b08b00;
font-size:21px;
font-weight:bold;
margin-bottom:7px
}

.stock{
color:#666;
font-size:14px;
margin-bottom:10px
}

.add{
width:100%;
background:#111;
color:#fff;
border:0;
padding:12px;
border-radius:8px;
font-weight:bold;
cursor:pointer
}

.add:disabled{
background:#aaa
}

.size-box{
margin-bottom:10px
}

.size-box select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
background:#fff
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:200
}

.overlay.show{
display:block
}

.cart-panel{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:450px;
height:100vh;
background:#fff;
z-index:300;
transition:.3s;
display:flex;
flex-direction:column
}

.cart-panel.open{
right:0
}

.cart-header{
background:#111;
color:#fff;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between
}

.cart-header h2{
color:#d4af37
}

.close-cart{
background:none;
border:0;
color:#fff;
font-size:28px;
cursor:pointer
}

.cart-list{
flex:1;
overflow-y:auto;
padding:15px
}

.cart-item{
border-bottom:1px solid #ddd;
padding:14px 0
}

.cart-item-name{
font-weight:bold;
margin-bottom:6px
}

.cart-item-price{
color:#b08b00;
font-weight:bold;
margin-bottom:8px
}

.quantity{
display:flex;
align-items:center;
gap:8px
}

.quantity button{
width:32px;
height:32px;
border:0;
border-radius:6px;
background:#111;
color:#fff;
font-size:18px
}

.remove{
margin-right:auto;
background:#c00!important
}

.customer-form{
padding:12px;
border-top:1px solid #ddd
}

.customer-form h3{
margin-bottom:10px
}

.customer-form input,
.customer-form select,
.customer-form textarea{
width:100%;
padding:10px;
margin-bottom:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
background:#fff
}

.customer-form textarea{
height:55px;
resize:none
}

.cart-bottom{
padding:12px;
border-top:1px solid #ddd;
background:#fafafa
}

.total{
font-size:21px;
font-weight:bold;
margin-bottom:10px
}

.whatsapp{
width:100%;
background:#25D366;
color:#fff;
border:0;
padding:14px;
border-radius:9px;
font-weight:bold;
font-size:15px;
cursor:pointer
}

.clear{
width:100%;
margin-top:7px;
padding:9px;
border:0;
border-radius:8px;
cursor:pointer
}

footer{
margin-top:50px;
background:#111;
color:#aaa;
text-align:center;
padding:25px
}

.loading{
grid-column:1/-1;
text-align:center;
padding:40px;
font-size:18px
}

.error{
grid-column:1/-1;
text-align:center;
padding:40px;
color:#c00
}

@media(max-width:600px){

.products{
grid-template-columns:repeat(2,1fr);
gap:12px
}

.product{
padding:10px
}

.product-image{
height:180px
}

.product h3{
font-size:16px
}

.price{
font-size:18px
}

.add{
font-size:12px
}

.cart-panel{
max-width:100%
}

}
</style>
</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qpctjcaygybpanzyweso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p_iM1Wod_z9W0kfBXAC90w_J8tH85fO";


let products=[];
let cart=[];
let selectedCategory="all";


/* =========================
   CATEGORY
========================= */

function getCategory(value){

const text=String(value||"")
.trim()
.toLowerCase();

if(
text.includes("حق") ||
text.includes("bag")
){
return "bags";
}

if(
text.includes("حذ") ||
text.includes("احذ") ||
text.includes("أحذ") ||
text.includes("shoe")
){
return "shoes";
}

if(
text.includes("كسسو") ||
text.includes("اكسسو") ||
text.includes("إكسسو") ||
text.includes("access")
){
return "accessories";
}

return "other";
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

const box=document.getElementById("products");

box.innerHTML=`
<div class="loading">
⏳ جاري تحميل المنتجات...
</div>
`;

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/Products?select=*&order=id.asc",
{
method:"GET",
headers:{
"apikey":SUPABASE_KEY,
"Accept":"application/json"
}
}
);

if(!response.ok){

const errorText=await response.text();

throw new Error(
"HTTP "+response.status+
" - "+errorText
);

}

const data=await response.json();

if(!Array.isArray(data)){

throw new Error(
"البيانات المستلمة غير صحيحة"
);

}

products=data;

showProducts(products);

}
catch(error){

console.error(
"SUPABASE ERROR:",
error
);

box.innerHTML=`
<div class="error">

❌ حدث خطأ في تحميل المنتجات

<br><br>

<small>
${escapeHTML(error.message)}
</small>

</div>
`;

}

}


/* =========================
   SHOW PRODUCTS
========================= */

function showProducts(list){

const box=document.getElementById("products");

box.innerHTML="";

if(!list.length){

box.innerHTML=`
<div class="loading">
لا توجد منتجات في هذا التصنيف.
</div>
`;

return;
}


list.forEach(product=>{

const id=product.id;

const name=
product.name||"منتج";

const description=
product.description||"";

const price=
Number(product.price)||0;

const stock=
Number(product.stock)||0;

const image=
String(product.image_url||"").trim();

const category=
getCategory(product.category);


let imageHTML="";


if(image){

imageHTML=`

<img
src="${escapeHTML(image)}"
alt="${escapeHTML(name)}"
loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
>

<div
class="no-image"
style="display:none">
🛍️
</div>

`;

}
else{

imageHTML=`
<div class="no-image">
🛍️
</div>
`;

}


let sizeHTML="";


if(category==="shoes"){

sizeHTML=`

<div class="size-box">

<select id="size-${id}">

<option value="">
اختر المقاس
</option>

<option value="36">36</option>
<option value="37">37</option>
<option value="38">38</option>
<option value="39">39</option>
<option value="40">40</option>
<option value="41">41</option>
<option value="42">42</option>
<option value="43">43</option>
<option value="44">44</option>
<option value="45">45</option>

</select>

</div>

`;

}


box.innerHTML+=`

<div class="product">

<div class="product-image">

${imageHTML}

</div>

<h3>
${escapeHTML(name)}
</h3>

<p class="description">
${escapeHTML(description)}
</p>

<div class="price">
${price.toLocaleString("fr-DZ")} دج
</div>

<div class="stock">
📦 المخزون: ${stock}
</div>

${sizeHTML}

<button
class="add"
onclick="addToCart(${id})"
${stock<=0?"disabled":""}>

${stock<=0?
"غير متوفر":
"🛒 أضف إلى السلة"}

</button>

</div>

`;

});

}


/* =========================
   FILTER
========================= */

function setCategory(category,button){

selectedCategory=category;

document
.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

filterProducts();

}


function filterProducts(){

const search=
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const result=
products.filter(product=>{

const category=
getCategory(product.category);

const name=
String(product.name||"")
.toLowerCase();

const description=
String(product.description||"")
.toLowerCase();

return(

selectedCategory==="all"||
category===selectedCategory

)&&(

name.includes(search)||
description.includes(search)

);

});

showProducts(result);

}


document
.getElementById("search")
.addEventListener(
"input",
filterProducts
);


/* =========================
   CART
========================= */

function addToCart(id){

const product=
products.find(
p=>Number(p.id)===Number(id)
);

if(!product)return;


const category=
getCategory(product.category);

let size="";


if(category==="shoes"){

const select=
document.getElementById(
"size-"+id
);

if(!select||!select.value){

alert("اختر مقاس الحذاء أولاً");

return;
}

size=select.value;

}


const existing=
cart.find(item=>
Number(item.id)===Number(id)&&
item.size===size
);


if(existing){

if(
existing.quantity>=
Number(product.stock)
){

alert("وصلت للكمية المتوفرة");

return;
}

existing.quantity++;

}
else{

cart.push({

id:id,

name:product.name,

price:Number(product.price)||0,

stock:Number(product.stock)||0,

size:size,

quantity:1

});

}


updateCart();

openCart();

}


/* =========================
   UPDATE CART
========================= */

function updateCart(){

const list=
document.getElementById("cartList");

const count=
document.getElementById("cartCount");

const totalBox=
document.getElementById("total");


list.innerHTML="";

let total=0;
let itemCount=0;


cart.forEach((item,index)=>{

const subtotal=
item.price*item.quantity;

total+=subtotal;

itemCount+=item.quantity;


list.innerHTML+=`

<div class="cart-item">

<div class="cart-item-name">
${escapeHTML(item.name)}
</div>

${item.size?
`<div>📏 المقاس: ${item.size}</div>`:
""}

<div class="cart-item-price">
${item.price.toLocaleString("fr-DZ")} دج
</div>

<div class="quantity">

<button
onclick="changeQuantity(${index},-1)">
−
</button>

<span>${item.quantity}</span>

<button
onclick="changeQuantity(${index},1)">
+
</button>

<button
class="remove"
onclick="removeItem(${index})">
🗑️
</button>

</div>

</div>

`;

});


if(!cart.length){

list.innerHTML=`
<div style="
text-align:center;
padding:40px;
color:#777">
السلة فارغة 🛒
</div>
`;

}


count.innerText=itemCount;

totalBox.innerText=
"المجموع: "+
total.toLocaleString("fr-DZ")+
" دج";

}


/* =========================
   QUANTITY
========================= */

function changeQuantity(index,change){

const item=cart[index];

if(!item)return;

const newQuantity=
item.quantity+change;

if(newQuantity<=0){

removeItem(index);

return;

}

if(newQuantity>item.stock){

alert(
"لا توجد كمية كافية في المخزون"
);

return;

}

item.quantity=newQuantity;

updateCart();

}


function removeItem(index){

cart.splice(index,1);

updateCart();

}


function clearCart(){

cart=[];

updateCart();

}


/* =========================
   CART OPEN/CLOSE
========================= */

function openCart(){

document
.getElementById("cartPanel")
.classList.add("open");

document
.getElementById("overlay")
.classList.add("show");

}


function closeCart(){

document
.getElementById("cartPanel")
.classList.remove("open");

document
.getElementById("overlay")
.classList.remove("show");

}

/* =========================

========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
