<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RONQA</title>

<link rel="stylesheet"
href="style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div class="logo">
RONQA
</div>

<div class="cart-button"
onclick="openCart()">

🛒 السلة

<span id="cartCount">
0
</span>

</div>

</header>


<!-- =========================
     SEARCH
========================= -->

<section class="search-section">

<input
type="text"
id="search"
placeholder="🔎 ابحث عن منتج..."
>

</section>


<!-- =========================
     CATEGORIES
========================= -->

<section class="categories">

<button
class="category active"
onclick="setCategory('all',this)">

الكل

</button>


<button
class="category"
onclick="setCategory('bags',this)">

👜 حقائب

</button>


<button
class="category"
onclick="setCategory('shoes',this)">

👟 أحذية

</button>


<button
class="category"
onclick="setCategory('accessories',this)">

💎 إكسسوارات

</button>


</section>


<!-- =========================
     PRODUCTS
========================= -->

<main>

<div
id="products"
class="products">

<div style="
grid-column:1/-1;
text-align:center;
padding:50px;">

جاري تحميل المنتجات...

</div>

</div>

</main>


<!-- =========================
     OVERLAY
========================= -->

<div
id="overlay"
class="overlay"
onclick="closeCart()">
</div>


<!-- =========================
     CART PANEL
========================= -->

<aside
id="cartPanel"
class="cart-panel">


<div class="cart-header">

<h2>
🛒 سلة المشتريات
</h2>


<button
onclick="closeCart()">

✕

</button>

</div>


<!-- CART ITEMS -->

<div
id="cartList"
class="cart-list">

<div style="
text-align:center;
padding:30px;
color:#777;">

السلة فارغة 🛒

</div>

</div>


<!-- =========================
     TOTAL
========================= -->

<div
id="total"
class="total">


<div style="
margin-bottom:10px;">

🛍️ مجموع المنتجات:

<strong id="productsTotal">

0 دج

</strong>

</div>


<div style="
margin-bottom:10px;">

🚚 التوصيل:

<strong id="deliveryPrice">

اختر الولاية

</strong>

</div>


<div style="
font-size:22px;
margin-top:12px;">

💰 المجموع النهائي:

<strong id="finalTotal">

0 دج

</strong>

</div>


</div>

========================= -->

<div class="order-form">

📦 معلومات التوصيل
</h3>
