<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RONQA</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f6;
color:#222;
}

header{
background:#111;
color:white;
padding:16px;
position:sticky;
top:0;
z-index:100;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
color:#d4af37;
font-size:30px;
font-weight:bold;
letter-spacing:5px;
}

.cart-button{
background:#d4af37;
border:0;
padding:11px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.hero{
background:#111;
color:white;
text-align:center;
padding:40px 15px;
}

.hero h1{
color:#d4af37;
font-size:40px;
letter-spacing:6px;
margin-bottom:10px;
}

.container{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

.search input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
margin-bottom:18px;
outline:none;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:20px;
}

.category{
background:white;
border:1px solid #ddd;
padding:11px 20px;
border-radius:25px;
font-weight:bold;
white-space:nowrap;
cursor:pointer;
}

.category.active{
background:#111;
color:#d4af37;
}

.title{
text-align:center;
margin-bottom:22px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
border-radius:15px;
padding:14px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product-image{
height:220px;
background:#eee;
border-radius:12px;
overflow:hidden;
margin-bottom:13px;
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.no-image{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.product h3{
margin-bottom:7px;
}

.description{
color:#777;
margin-bottom:8px;
}

.price{
color:#b08b00;
font-size:21px;
font-weight:bold;
margin-bottom:7px;
}

.stock{
color:#666;
font-size:14px;
margin-bottom:10px;
}

.add{
width:100%;
background:#111;
color:white;
border:0;
padding:12px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.add:disabled{
background:#aaa;
}

.size-box{
margin-bottom:10px;
}

.size-box select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
background:white;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:200;
}

.overlay.show{
display:block;
}

.cart-panel{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:450px;
height:100vh;
background:white;
z-index:300;
transition:.3s;
display:flex;
flex-direction:column;
}

.cart-panel.open{
right:0;
}

.cart-header{
background:#111;
color:white;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.cart-header h2{
color:#d4af37;
}

.close-cart{
background:none;
border:0;
color:white;
font-size:28px;
cursor:pointer;
}

.cart-list{
flex:1;
overflow-y:auto;
padding:15px;
}

.cart-item{
border-bottom:1px solid #ddd;
padding:14px 0;
}

.cart-item-name{
font-weight:bold;
margin-bottom:6px;
}

.cart-item-price{
color:#b08b00;
font-weight:bold;
margin-bottom:8px;
}

.quantity{
display:flex;
align-items:center;
gap:8px;
}

.quantity button{
width:32px;
height:32px;
border:0;
border-radius:6px;
background:#111;
color:white;
font-size:18px;
}

.remove{
margin-right:auto;
background:#c00 !important;
}

.customer-form{
padding:12px;
border-top:1px solid #ddd;
max-height:330px;
overflow-y:auto;
}

.customer-form h3{
margin-bottom:10px;
}

.customer-form input,
.customer-form select,
.customer-form textarea{
width:100%;
padding:11px;
margin-bottom:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
background:white;
}

.customer-form textarea{
height:55px;
resize:none;
}

.cart-bottom{
padding:12px;
border-top:1px solid #ddd;
background:#fafafa;
}

.total{
font-size:21px;
font-weight:bold;
margin-bottom:10px;
}

.whatsapp{
width:100%;
background:#25D366;
color:white;
border:0;
padding:14px;
border-radius:9px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.clear{
width:100%;
margin-top:7px;
padding:9px;
border:0;
border-radius:8px;
cursor:pointer;
}

footer{
margin-top:50px;
background:#111;
color:#aaa;
text-align:center;
padding:25px;
}

.loading{
grid-column:1/-1;
text-align:center;
padding:50px;
font-size:18px;
color:#777;
}

.error{
grid-column:1/-1;
text-align:center;
padding:40px;
color:#c00;
}

@media(max-width:600px){

.products{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.product{
padding:10px;
}

.product-image{
height:180px;
}

.product h3{
font-size:16px;
}

.price{
font-size:18px;
}

.add{
font-size:12px;
}

.cart-panel{
max-width:100%;
}

}
</style>
</head>

/* =====================================

function loadWilayas(){

const select =
document.getElementById("wilaya");

Object.keys(wilayas).forEach(function(wilaya){

document.createElement("option");

option.value = wilaya;
option.textContent = wilaya;

select.appendChild(option);

/* =====================================
   UPDATE CITIES
===================================== */

function updateCities(){

const wilaya =
document.getElementById("wilaya").value;

const city =
document.getElementById("city");

city.innerHTML = "";

const first =
document.createElement("option");

first.value = "";
first.textContent =
"🏙️ اختر المدينة / البلدية";

city.appendChild(first);


if(!wilaya)return;


const cities =
wilayas[wilaya] || [];


cities.forEach(function(name){

const option =
document.createElement("option");

option.value = name;
option.textContent = name;

city.appendChild(option);

});

}


/* =====================================
   CATEGORY
===================================== */

function getCategory(value){

const text =
String(value || "")
.trim()
.toLowerCase();

if(
text.includes("حق") ||
text.includes("bag") ||
text.includes("sac")
){
return "bags";
}

if(
text.includes("حذ") ||
text.includes("احذ") ||
text.includes("أحذ") ||
text.includes("shoe") ||
text.includes("chauss")
){
return "shoes";
}

if(
text.includes("كسسو") ||
text.includes("اكسسو") ||
text.includes("إكسسو") ||
text.includes("access") ||
text.includes("accessoire")
){
return "accessories";
}

return "other";

}


/* =====================================
   LOAD PRODUCTS
===================================== */

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML =
'<div class="loading">⏳ جاري تحميل المنتجات...</div>';


try{

const controller =
new AbortController();

const timeout =
setTimeout(function(){
controller.abort();
},15000);


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/Products?select=*",

{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Accept":"application/json"
},

signal:controller.signal

}
);


clearTimeout(timeout);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const data =
await response.json();


if(!Array.isArray(data)){

throw new Error(
"البيانات غير صحيحة"
);

}


products = data;


showProducts(products);


}

catch(error){

console.error(
"Supabase Error:",
error
);


box.innerHTML = `

<div class="error">

❌ تعذر تحميل المنتجات

<br><br>

<span style="font-size:14px;color:#777">

تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.

</span>

<br><br>

<button
onclick="loadProducts()"
style="

border:0;
border-radius:8px;
background:#111;
color:white;
cursor:pointer;

🔄 إعادة المحاولة

</button>

</div>

`;

}

}

category;

/* =====================================
   FILTER
===================================== */

function filterProducts(){

const search =
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const result =
products.filter(function(product){

const category =
getCategory(product.category);

const name =
String(product.name || "")
.toLowerCase();

const description =
String(product.description || "")
.toLowerCase();


return (

(selectedCategory === "all" ||
category === selectedCategory)

&&

(
name.includes(search) ||
description.includes(search)
)

);

});


showProducts(result);

}


/* =====================================
   SEARCH
===================================== */

document
.getElementById("search")
.addEventListener(

filterProducts
);

return Number(p.id) === Number(id);

});


if(!product)return;


const category =
getCategory(product.category);


let size = "";

);

);

return;

}


size =
select.value;

}


const existing =
cart.find(function(item){

Number(item.id) === Number(id)

);

});


if(existing){

if(

Number(product.stock)

existing.quantity++;

}else{

cart.push({

name:product.name,

price:Number(product.price)||0,

stock:Number(product.stock)||0,

size:size,

quantity:1

});

}


updateCart();

openCart();

}

/* =====================================
   QUANTITY
===================================== */

function changeQuantity(index,change){

const item =
cart[index];

if(!item)return;


const newQuantity =
item.quantity + change;


if(newQuantity <= 0){

removeItem(index);

return;

}


if(newQuantity > item.stock){

alert(
"لا توجد كمية كافية في المخزون"
);

return;

}


item.quantity =
newQuantity;


updateCart();

}
