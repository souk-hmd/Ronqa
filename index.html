<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RONQA</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#222;
}

/* HEADER */

header{
background:#111;
color:white;
padding:18px 15px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:31px;
font-weight:bold;
letter-spacing:5px;
color:#d4af37;
}

.cart{
background:#d4af37;
border:0;
padding:11px 16px;
border-radius:8px;
font-weight:bold;
}

/* HERO */

.hero{
background:#111;
color:white;
text-align:center;
padding:45px 15px;
}

.hero h1{
font-size:42px;
color:#d4af37;
letter-spacing:6px;
margin-bottom:10px;
}

.hero p{
color:#ddd;
}

/* CONTAINER */

.container{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

/* SEARCH */

.search{
margin-bottom:20px;
}

.search input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;
}

/* CATEGORIES */

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:22px;
}

.category{
background:white;
border:1px solid #ddd;
border-radius:25px;
padding:11px 20px;
font-weight:bold;
white-space:nowrap;
cursor:pointer;
}

.category.active{
background:#111;
color:#d4af37;
border-color:#111;
}

/* TITLE */

.title{
text-align:center;
font-size:28px;
margin-bottom:25px;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
border-radius:15px;
padding:15px;
box-shadow:
0 4px 15px rgba(0,0,0,.08);
}

.product-image{
width:100%;
height:220px;
background:#eee;
border-radius:12px;
overflow:hidden;
margin-bottom:15px;
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.no-image{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.product h3{
font-size:19px;
margin-bottom:8px;
}

.description{
color:#777;
min-height:35px;
margin-bottom:8px;
}

.price{
font-size:21px;
font-weight:bold;
color:#b08b00;
margin-bottom:7px;
}

.stock{
font-size:14px;
color:#666;
}

/* FOOTER */

footer{
margin-top:50px;
background:#111;
color:#aaa;
text-align:center;
padding:25px;
}

/* MOBILE */

@media(max-width:600px){

.products{
grid-template-columns:
repeat(2,1fr);

gap:12px;
}

.product{
padding:10px;
}

.product-image{
height:180px;
}

.product h3{
font-size:16px;
}

.price{
font-size:18px;
}

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="header">

<div class="logo">
RONQA
</div>

<button class="cart">
🛒 السلة
</button>

</div>

</header>


<!-- HERO -->

<section class="hero">

<h1>
RONQA
</h1>

<p>
متجر إلكتروني للمنتجات المميزة
</p>

</section>


<!-- MAIN -->

<div class="container">


<!-- SEARCH -->

<div class="search">

<input
id="search"
type="text"
placeholder="🔎 ابحث عن منتج..."
>

</div>


<!-- CATEGORIES -->

<div class="categories">


<button
class="category active"
onclick="chooseCategory('all',this)">

الكل

</button>


<button
class="category"
onclick="chooseCategory('bags',this)">

👜 حقائب

</button>


<button
class="category"
onclick="chooseCategory('shoes',this)">

👟 أحذية

</button>


<button
class="category"
onclick="chooseCategory('accessories',this)">

⌚ إكسسوارات

</button>


</div>


<h2 class="title">

🛍️ منتجاتنا

</h2>


<!-- PRODUCTS -->

<div
id="products"
class="products">

<div
style="
grid-column:1/-1;
text-align:center;
padding:40px;">

جاري تحميل المنتجات...

</div>

</div>


</div>


<footer>

© 2026 RONQA

</footer>


<script>


/* ==================================
SUPABASE
================================== */


const SUPABASE_URL =
"https://qpctjcaygybpanzyweso.supabase.co";


const SUPABASE_KEY =
"sb_publishable_p_iM1Wod_z9W0kfBXAC90w_J8tH85fO";


/* ==================================
VARIABLES
================================== */


let products = [];


let selectedCategory =
"all";


const productsBox =
document.getElementById(
"products"
);


/* ==================================
NORMALIZE CATEGORY
================================== */

function normalizeCategory(value){

let text =
String(value || "")
.trim()
.toLowerCase();


/* إزالة المسافات */

text =
text.replace(/\s+/g,"");


/* أحذية / احذية */

if(
text.includes("أحذ") ||
text.includes("احذ")
){

return "shoes";

}


/* إكسسوارات / اكسسوارات */

if(
text.includes("إكسسو") ||
text.includes("اكسسو") ||
text.includes("كسسو")
){

return "accessories";

}


/* حقائب */

if(
text.includes("حقائب") ||
text.includes("حقايب") ||
text.includes("حق")
){

return "bags";

}


/* أي تصنيف آخر */

return text;

}


/* ==================================
LOAD PRODUCTS
================================== */

async function loadProducts(){

try{


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/Products?select=*",

{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json"

}

}

);


if(!response.ok){

const error =
await response.text();

throw new Error(
"HTTP " +
response.status +
" : " +
error
);

}


products =
await response.json();


if(!Array.isArray(products)){

throw new Error(
"البيانات غير صحيحة"
);

}


/* عرض المنتجات */

displayProducts(products);


}

catch(error){


console.error(
"Supabase Error:",
error
);


productsBox.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
">

<h3>
❌ حدث خطأ في تحميل المنتجات
</h3>

<p style="
margin-top:12px;
color:#777;
font-size:12px;
direction:ltr;
">

${error.message}

</p>

</div>

`;

}

}


/* ==================================
DISPLAY PRODUCTS
================================== */

function displayProducts(list){

productsBox.innerHTML = "";


if(list.length === 0){

productsBox.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
">

لا توجد منتجات في هذا التصنيف.

</div>

`;

return;

}


/* المنتجات */

list.forEach(product=>{


const name =
product.name || "منتج";


const description =
product.description || "";


const price =
Number(product.price) || 0;


const stock =
Number(product.stock) || 0;


const image =
String(
product.image_url || ""
).trim();


let imageHTML = "";


if(image){

imageHTML = `

<img

src="${image}"

alt="${escapeHTML(name)}"

loading="lazy"

onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"

>

<div
class="no-image"
style="display:none">

🛍️

</div>

`;

}else{

imageHTML = `

<div class="no-image">

🛍️

</div>

`;

}


/* بطاقة المنتج */

productsBox.innerHTML += `

<div class="product">


<div class="product-image">

${imageHTML}

</div>


<h3>

${escapeHTML(name)}

</h3>


<p class="description">

${escapeHTML(description)}

</p>


<div class="price">

${price.toLocaleString("fr-DZ")}
دج

</div>


<div class="stock">

📦 المخزون:
${stock}

</div>


</div>

`;

});

}


/* ==================================
CATEGORY FILTER
================================== */

function chooseCategory(
category,
button
){

selectedCategory =
category;


/* الزر النشط */

document
.querySelectorAll(".category")
.forEach(btn=>{

btn.classList.remove(
"active"
);

});


button.classList.add(
"active"
);


/* فلترة */

filterProducts();

}


/* ==================================
FILTER PRODUCTS
================================== */

function filterProducts(){


const searchText =
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const filtered =
products.filter(product=>{


/* تصنيف المنتج */

const productCategory =
normalizeCategory(
product.category
);


/* التصنيف */

let categoryMatch =
true;


if(
selectedCategory !== "all"
){

categoryMatch =
productCategory ===
selectedCategory;

}


/* البحث */

const name =
String(
product.name || ""
)
.toLowerCase();


const description =
String(
product.description || ""
)
.toLowerCase();


const searchMatch =
name.includes(searchText) ||
description.includes(searchText);


return (
categoryMatch &&
searchMatch
);

});


displayProducts(
filtered
);

}


/* ==================================
SEARCH
================================== */

document
.getElementById("search")
.addEventListener(
"input",
filterProducts
);


/* ==================================
HTML SECURITY
================================== */

function escapeHTML(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* ==================================
START
================================== */

loadProducts();


</script>


</body>

  </html>
