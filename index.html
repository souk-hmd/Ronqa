<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RONQA</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header">
        <div class="logo">RONQA</div>

        <button class="cart-button" onclick="openCart()">
            🛒 السلة
            (<span id="cartCount">0</span>)
        </button>
    </div>
</header>

<section class="hero">
    <h1>RONQA</h1>
    <p>منتجات مميزة بأسعار مناسبة</p>
</section>

<main class="container">

    <div class="search">
        <input
            id="search"
            type="text"
            placeholder="🔎 ابحث عن منتج..."
        >
    </div>

    <div class="categories">

        <button
            class="category active"
            onclick="setCategory('all',this)">
            الكل
        </button>

        <button
            class="category"
            onclick="setCategory('bags',this)">
            👜 حقائب
        </button>

        <button
            class="category"
            onclick="setCategory('shoes',this)">
            👟 أحذية
        </button>

        <button
            class="category"
            onclick="setCategory('accessories',this)">
            ⌚ إكسسوارات
        </button>

    </div>

    <h2 class="title">🛍️ منتجاتنا</h2>

    <div id="products" class="products">

        <div class="loading">
            جاري تحميل المنتجات...
        </div>

    </div>

</main>

<!-- OVERLAY -->

<div
    id="overlay"
    class="overlay"
    onclick="closeCart()">
</div>


<!-- CART -->

<div id="cartPanel" class="cart-panel">

    <div class="cart-header">

        <h2>🛒 السلة</h2>

        <button
            class="close-cart"
            onclick="closeCart()">
            ×
        </button>

    </div>


    <div id="cartList" class="cart-list"></div>


    <!-- CUSTOMER -->

    <div class="customer-form">

        <h3>📋 معلومات الطلب</h3>

        <input
            id="customerName"
            type="text"
            placeholder="👤 اسم الزبون"
        >

        <input
            id="customerPhone"
            type="tel"
            placeholder="📞 رقم الهاتف"
        >


        <!-- WILAYA -->

        <select
            id="wilaya"
            onchange="loadCities()">

            <option value="">
                📍 اختر الولاية
            </option>

        </select>


        <!-- CITY -->

        <select id="city">

            <option value="">
                🏙️ اختر المدينة / البلدية
            </option>

        </select>


        <input
            id="address"
            type="text"
            placeholder="🏠 العنوان"
        >

        <textarea
            id="note"
            placeholder="📝 ملاحظة اختيارية">
        </textarea>

    </div>


    <!-- DELIVERY -->

    <div class="delivery-box">

        <h3>🚚 التوصيل</h3>

        <select id="delivery" onchange="updateCart()">

            <option value="">
                اختر طريقة التوصيل
            </option>

            <option value="home">
                🏠 توصيل للمنزل
            </option>

            <option value="office">
                📦 استلام من المكتب
            </option>

        </select>


        <input
            id="deliveryPrice"
            type="number"
            min="0"
            placeholder="💰 سعر التوصيل (دج)"
            oninput="updateCart()"
        >

    </div>


    <!-- CART BOTTOM -->

    <div class="cart-bottom">

        <div id="subtotal" class="subtotal">
            المنتجات: 0 دج
        </div>

        <div id="deliveryTotal" class="delivery-total">
            التوصيل: 0 دج
        </div>

        <div id="total" class="total">
            المجموع النهائي: 0 دج
        </div>


        <button
            class="whatsapp"
            onclick="sendOrder()">

            💬 إرسال الطلب عبر WhatsApp

        </button>


        <button
            class="clear"
            onclick="clearCart()">

            🗑️ تفريغ السلة

        </button>

    </div>

</div>


<footer>
    © 2026 RONQA
</footer>


<script src="data.js"></script>
<script src="app.js"></script>

</body>
  </html>
