}

/* HEADER */

header{
background:#111;
color:white;
padding:17px 15px;
position:sticky;
top:0;
z-index:100;
}

max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
color:#d4af37;
font-size:31px;
font-weight:bold;
letter-spacing:5px;
}

.logo small{
display:block;
font-size:9px;
color:#ddd;
letter-spacing:3px;
text-align:center;
margin-top:4px;
}

.cart-btn{
background:#d4af37;
border:0;
border-radius:9px;
padding:11px 16px;
font-weight:bold;
cursor:pointer;
}

/* HERO */

.hero{
background:#111;
color:white;
text-align:center;
padding:42px 15px;
}

.hero h1{
font-size:40px;
color:#d4af37;
letter-spacing:5px;
margin-bottom:10px;
}

.hero p{
color:#ddd;
}

/* MAIN */

.container{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

/* SEARCH */

.search{
margin-bottom:18px;
}

.search input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;
}

/* CATEGORIES */

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding:5px 0 20px;
}

.category{
white-space:nowrap;
border:1px solid #ddd;
background:white;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

.category.active{
background:#111;
color:#d4af37;
border-color:#111;
}

/* PRODUCTS */

.title{
text-align:center;
margin-bottom:22px;
font-size:27px;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.image{
width:100%;
height:220px;
background:#eee;
border-radius:12px;
overflow:hidden;
margin-bottom:14px;
}

.image img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.no-image{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.product h3{
font-size:20px;
margin-bottom:7px;
}

.description{
color:#777;
margin-bottom:9px;
min-height:35px;
}

.price{
font-size:21px;
font-weight:bold;
color:#b08b00;
margin-bottom:7px;
}

.stock{
font-size:14px;
color:#666;
margin-bottom:12px;
}

/* SIZE */

.size-box{
margin-bottom:12px;
}

.size-box label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

.size-select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
background:white;
font-size:15px;
}

/* ADD */

.add{
width:100%;
background:#111;
color:white;
border:0;
padding:13px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.add:hover{
background:#d4af37;
color:#111;
}

.add:disabled{
background:#aaa;
cursor:not-allowed;
}

/* CART */

.cart{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:440px;
height:100vh;
background:white;
z-index:300;
transition:.3s;
display:flex;
flex-direction:column;
box-shadow:-5px 0 20px rgba(0,0,0,.2);
}

.cart.open{
right:0;
}

.cart-head{
background:#111;
color:white;
padding:17px;
display:flex;
justify-content:space-between;
align-items:center;
}

.cart-head h2{
color:#d4af37;
}

.close{
background:none;
border:0;
color:white;
font-size:26px;
cursor:pointer;
}

.cart-list{
flex:1;
overflow-y:auto;
padding:15px;
}

.cart-item{
border-bottom:1px solid #ddd;
padding:14px 0;
}

.cart-name{
font-weight:bold;
margin-bottom:7px;
}

.cart-size{
color:#555;
margin-bottom:7px;
}

.cart-price{
color:#b08b00;
font-weight:bold;
margin-bottom:9px;
}

.qty{
display:flex;
align-items:center;
gap:10px;
}

.qty button{
width:32px;
height:32px;
border:0;
background:#111;
color:white;
border-radius:6px;
cursor:pointer;
}

.delete{
margin-right:auto;
background:#c00 !important;
}

.customer-form{
border-top:1px solid #ddd;
padding:14px;
background:white;
}

.customer-form h3{
margin-bottom:11px;
}

.customer-form input,
.customer-form select,
.customer-form textarea{
width:100%;
padding:11px;
margin-bottom:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
outline:none;
background:white;
}

.customer-form textarea{
height:60px;
resize:none;
}

padding:14px;
border-top:1px solid #ddd;
background:#fafafa;
}

.total{
font-size:21px;
font-weight:bold;
margin-bottom:11px;

.whatsapp-order{
display:block;

color:white;
text-align:center;
padding:14px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}

.clear{
width:100%;
margin-top:8px;
padding:10px;
border:0;
border-radius:8px;
cursor:pointer;
}

display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);

}

.overlay.show{
display:block;

text-align:center;
padding:35px 15px;

.price{

.cart{

/* CATEGORY */

function filterCategory(category,button){

currentCategory =
category;


document
.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});


button.classList.add("active");


applyFilters();

}


/* FILTER */

function applyFilters(){

const text =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const selected =
String(currentCategory)
.trim()
.toLowerCase();


const filtered =
products.filter(product=>{

const productCategory =
String(product.category||"")
.trim()
.toLowerCase();


const name =
String(product.name||"")
.toLowerCase();


const description =
String(product.description||"")
.toLowerCase();


const categoryOK =
selected==="all" ||
productCategory.includes(selected);


const searchOK =
name.includes(text) ||
description.includes(text);


return categoryOK && searchOK;

});


showProducts(filtered);

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
"input",
applyFilters
);


/* ADD CART */

function addToCart(id){

const product =
products.find(
p=>Number(p.id)===Number(id)
);


if(!product)return;


const stock =
Number(product.stock)||0;


if(stock<=0){

alert("المنتج غير متوفر");

return;

}


const category =
String(product.category||"")
.trim();


let size="";


if(category.includes("أحذية")){

const select =
document.getElementById(
"size-"+product.id
);


if(!select || !select.value){

alert("من فضلك اختر المقاس");

return;

}


size=select.value;

}


/* SAME PRODUCT + SAME SIZE */

const existing =
cart.find(item=>

Number(item.id)===Number(id)
&&
item.size===size

);


if(existing){

if(existing.quantity<stock){

existing.quantity++;

}else{

alert(
"لا يمكن تجاوز المخزون"
);

return;

}

}else{

cart.push({

id:product.id,

name:product.name,

price:Number(product.price)||0,

stock:stock,

size:size,

quantity:1

});

}


updateCart();

openCart();

}


/* UPDATE CART */

function updateCart(){

const list =
document.getElementById(
"cartList"
);

const count =
document.getElementById(
"count"
);

const totalBox =
document.getElementById(
"total"
);


list.innerHTML="";


let total=0;

let countNumber=0;


cart.forEach((item,index)=>{

const subtotal =
item.price*item.quantity;


total+=subtotal;

countNumber+=item.quantity;


list.innerHTML+=`

<div class="cart-item">

<div class="cart-name">
${item.name}
</div>

${
item.size
?
`
<div class="cart-size">
📏 المقاس: ${item.size}
</div>
`
:
""
}

<div class="cart-price">
${item.price} دج
</div>

<div class="qty">

<button
onclick="changeQty(${index},-1)">
−
</button>

<span>
${item.quantity}
</span>

<button
onclick="changeQty(${index},1)">
+
</button>

<button
class="delete"
onclick="removeItem(${index})">
🗑️
</button>

</div>

<div style="margin-top:8px;">

المجموع:
${subtotal} دج

</div>

</div>

`;

});


if(!cart.length){

list.innerHTML=`

<div style="
text-align:center;
padding:30px;
color:#777;">

السلة فارغة 🛒

</div>

`;

}


count.innerText =
countNumber;


totalBox.innerText =
"المجموع: "+total+" دج";

}


/* QUANTITY */

function changeQty(index,value){

const item =
cart[index];


if(!item)return;


const newQty =
item.quantity+value;


if(newQty<=0){

removeItem(index);

return;

}


if(newQty>item.stock){

alert(
"لا يمكن تجاوز المخزون"
);

return;

}


item.quantity =
newQty;


updateCart();

}


/* REMOVE */

function removeItem(index){

cart.splice(index,1);

updateCart();

}


/* CLEAR */

function clearCart(){

cart=[];

updateCart();

}
