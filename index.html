<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RONQA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f6f6;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px 15px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#d4af37;
  font-size:30px;
  font-weight:bold;
  letter-spacing:5px;
}

.cart-btn{
  background:#d4af37;
  border:0;
  padding:11px 15px;
  border-radius:8px;
  font-weight:bold;
}

.hero{
  background:#111;
  color:white;
  text-align:center;
  padding:40px 15px;
}

.hero h1{
  color:#d4af37;
  font-size:40px;
  letter-spacing:5px;
  margin-bottom:10px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.search{
  margin-bottom:18px;
}

.search input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

/* التصنيفات */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:5px 0 20px;
}

.category{
  white-space:nowrap;
  border:1px solid #ddd;
  background:white;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.category.active{
  background:#111;
  color:#d4af37;
  border-color:#111;
}

.title{
  text-align:center;
  margin-bottom:22px;
  font-size:28px;
}

/* المنتجات */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.image{
  width:100%;
  height:220px;
  background:#eee;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:14px;
}

.image img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.no-image{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

.product h3{
  font-size:19px;
  margin-bottom:7px;
}

.description{
  color:#777;
  min-height:35px;
  margin-bottom:9px;
}

.price{
  color:#b08b00;
  font-size:21px;
  font-weight:bold;
  margin-bottom:7px;
}

.stock{
  color:#666;
  font-size:14px;
  margin-bottom:12px;
}

.add{
  width:100%;
  background:#111;
  color:white;
  border:0;
  padding:13px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.add:disabled{
  background:#aaa;
  cursor:not-allowed;
}

footer{
  margin-top:50px;
  background:#111;
  color:#aaa;
  text-align:center;
  padding:25px;
}

@media(max-width:600px){

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product{
    padding:10px;
  }

  .image{
    height:180px;
  }

  .product h3{
    font-size:16px;
  }

  .price{
    font-size:18px;
  }

  .add{
    font-size:12px;
    padding:11px 5px;
  }

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
RONQA
</div>

<button class="cart-btn">
🛒 السلة
</button>

</div>

</header>


<section class="hero">

<h1>RONQA</h1>

<p>
منتجات مميزة بأسعار مناسبة
</p>

</section>


<div class="container">

<!-- البحث -->

<div class="search">

<input
id="search"
type="text"
placeholder="🔎 ابحث عن منتج..."
>

</div>


<!-- التصنيفات -->

<div class="categories">

<button
class="category active"
onclick="filterCategory('all',this)">
الكل
</button>

<button
class="category"
onclick="filterCategory('حقائب',this)">
👜 حقائب
</button>

<button
class="category"
onclick="filterCategory('أحذية',this)">
👟 أحذية
</button>

<button
class="category"
onclick="filterCategory('إكسسوارات',this)">
⌚ إكسسوارات
</button>

</div>


<h2 class="title">
🛍️ منتجاتنا
</h2>


<div
id="products"
class="products">

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;">

جاري تحميل المنتجات...

</div>

</div>

</div>


<footer>
© 2026 RONQA
</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qpctjcaygybpanzyweso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p_iM1Wod_z9W0kfBXAC90w_J8tH85fO";


/* =========================
   VARIABLES
========================= */

let products = [];

let currentCategory = "all";


const productsBox =
document.getElementById("products");


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

try{

const url =
SUPABASE_URL +
"/rest/v1/Products?select=*";


const response =
await fetch(url,{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
}

});


if(!response.ok){

const errorText =
await response.text();

throw new Error(
"HTTP "+response.status+
" - "+errorText
);

}


products =
await response.json();


console.log("Products:",products);


if(!Array.isArray(products)){

throw new Error(
"البيانات المستلمة ليست قائمة منتجات"
);

}


showProducts(products);


}

catch(error){

console.error(error);


productsBox.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
">

<h3>
❌ حدث خطأ في تحميل المنتجات
</h3>

<p style="
margin-top:15px;
color:#777;
direction:ltr;
font-size:12px;
">

${error.message}

</p>

</div>

`;

}

}


/* =========================
   عرض المنتجات
========================= */

function showProducts(list){

productsBox.innerHTML = "";


if(!list.length){

productsBox.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
">

لا توجد منتجات في هذا التصنيف.

</div>

`;

return;

}


list.forEach(product=>{


const id =
product.id;


const name =
product.name || "منتج";


const description =
product.description || "";


const price =
Number(product.price) || 0;


const stock =
Number(product.stock) || 0;


const image =
String(product.image_url || "").trim();


const category =
String(product.category || "").trim();


/* الصورة */

let imageHTML = "";


if(image){

imageHTML = `

<img
src="${image}"
alt="${name}"
loading="lazy"
onerror="imageError(this)"
>

<div
class="no-image"
style="display:none">

🛍️

</div>

`;

}else{

imageHTML = `

<div class="no-image">

🛍️

</div>

`;

}


/* المنتج */

productsBox.innerHTML += `

<div class="product">

<div class="image">

${imageHTML}

</div>


<h3>
${escapeHTML(name)}
</h3>


<p class="description">
${escapeHTML(description)}
</p>


<div class="price">
${price.toLocaleString("ar-DZ")} دج
</div>


<div class="stock">

📦 متوفر: ${stock}

</div>


<button
class="add"
onclick="addToCart(${id})"
${stock <= 0 ? "disabled" : ""}>

${stock <= 0
? "غير متوفر"
: "🛒 أضف إلى السلة"}

</button>


</div>

`;

});

}


/* =========================
   خطأ الصورة
========================= */

function imageError(img){

img.style.display="none";


if(img.nextElementSibling){

img.nextElementSibling.style.display="flex";

}

}


/* =========================
   حماية النص
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   التصنيف
========================= */

function filterCategory(category,button){

currentCategory =
category;


document
.querySelectorAll(".category")
.forEach(btn=>{

btn.classList.remove("active");

});


button.classList.add("active");


applyFilters();

}


/* =========================
   البحث + التصنيف
========================= */

function applyFilters(){

const searchText =
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const selectedCategory =
String(currentCategory)
.trim()
.toLowerCase();


const filtered =
products.filter(product=>{


const productCategory =
String(product.category || "")
.trim()
.toLowerCase();


const name =
String(product.name || "")
.toLowerCase();


const description =
String(product.description || "")
.toLowerCase();


/*
التصنيف:
all = كل المنتجات
*/

let categoryOK = true;


if(selectedCategory !== "all"){

categoryOK =
productCategory === selectedCategory;

}


/* البحث */

const searchOK =
name.includes(searchText) ||
description.includes(searchText);


return categoryOK && searchOK;

});


showProducts(filtered);

}


/* =========================
   البحث
========================= */

document
.getElementById("search")
.addEventListener(
"input",
applyFilters
);


/* =========================
   زر السلة مؤقتًا
========================= */

function addToCart(id){

const product =
products.find(
p => Number(p.id) === Number(id)
);


if(!product)return;


alert(
"تمت إضافة «"+
product.name+
"» إلى السلة 🛒"
);

}


/* =========================
   تشغيل
========================= */

loadProducts();

</script>

</body>
</html>
