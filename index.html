<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RONQA</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="header">

<div class="logo">
RONQA
</div>

<button
class="cart-button"
onclick="openCart()">

🛒 السلة
(<span id="cartCount">0</span>)

</button>

</div>

</header>


<section class="hero">

<h1>RONQA</h1>

<p>
منتجات مميزة بأسعار مناسبة
</p>

</section>


<div class="container">


<div class="search">

<input
id="search"
type="text"
placeholder="🔎 ابحث عن منتج..."
>

</div>


<div class="categories">

<button
class="category active"
onclick="setCategory('all',this)">
الكل
</button>

<button
class="category"
onclick="setCategory('bags',this)">
👜 حقائب
</button>

<button
class="category"
onclick="setCategory('shoes',this)">
👟 أحذية
</button>

<button
class="category"
onclick="setCategory('accessories',this)">
⌚ إكسسوارات
</button>

</div>


<h2 class="title">
🛍️ منتجاتنا
</h2>


<div
id="products"
class="products">

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;">

جاري تحميل المنتجات...

</div>

</div>

</div>


<div
id="overlay"
class="overlay"
onclick="closeCart()">
</div>


<div
id="cartPanel"
class="cart-panel">


<div class="cart-header">

<h2>🛒 السلة</h2>

<button
class="close-cart"
onclick="closeCart()">
×
</button>

</div>


<div
id="cartList"
class="cart-list">
</div>


<div class="customer-form">

<h3>
📋 معلومات الطلب
</h3>


<input
id="customerName"
type="text"
placeholder="👤 اسم الزبون"
>


<input
id="customerPhone"
type="tel"
placeholder="📞 رقم الهاتف"
>


<select id="wilaya">

<option value="">
📍 اختر الولاية
</option>

<option>أدرار</option>
<option>الشلف</option>
<option>الأغواط</option>
<option>أم البواقي</option>
<option>باتنة</option>
<option>بجاية</option>
<option>بسكرة</option>
<option>بشار</option>
<option>البليدة</option>
<option>البويرة</option>
<option>تمنراست</option>
<option>تبسة</option>
<option>تلمسان</option>
<option>تيارت</option>
<option>تيزي وزو</option>
<option>الجزائر</option>
<option>الجلفة</option>
<option>جيجل</option>
<option>سطيف</option>
<option>سعيدة</option>
<option>سكيكدة</option>
<option>سيدي بلعباس</option>
<option>عنابة</option>
<option>قالمة</option>
<option>قسنطينة</option>
<option>المدية</option>
<option>مستغانم</option>
<option>المسيلة</option>
<option>معسكر</option>
<option>ورقلة</option>
<option>وهران</option>
<option>البيض</option>
<option>إليزي</option>
<option>برج بوعريريج</option>
<option>بومرداس</option>
<option>الطارف</option>
<option>تندوف</option>
<option>تيسمسيلت</option>
<option>الوادي</option>
<option>خنشلة</option>
<option>سوق أهراس</option>
<option>تيبازة</option>
<option>ميلة</option>
<option>عين الدفلى</option>
<option>النعامة</option>
<option>عين تموشنت</option>
<option>غرداية</option>
<option>غليزان</option>
<option>تيميمون</option>
<option>برج باجي مختار</option>
<option>أولاد جلال</option>
<option>بني عباس</option>
<option>عين صالح</option>
<option>عين قزام</option>
<option>تقرت</option>
<option>جانت</option>
<option>المغير</option>
<option>المنيعة</option>

</select>


<select id="city">

<option value="">
🏙️ اختر المدينة / البلدية
</option>

</select>


<input
id="address"
type="text"
placeholder="🏠 العنوان"
>


<textarea
id="note"
placeholder="📝 ملاحظة اختيارية">
</textarea>

</div>


<div class="cart-bottom">

<div
id="total"
class="total">

المجموع: 0 دج

</div>


<button
class="whatsapp"
onclick="sendOrder()">

💬 إرسال الطلب عبر WhatsApp

</button>


<button
class="clear"
onclick="clearCart()">

🗑️ تفريغ السلة

</button>

</div>

</div>


<footer>

© 2026 RONQA

</footer>


<script src="data.js"></script>
<script src="app.js"></script>

</body>

    </html>
