<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RONQA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f6f6;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:16px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:#d4af37;
  font-size:30px;
  font-weight:bold;
  letter-spacing:5px;
}

.cart-button{
  background:#d4af37;
  border:0;
  padding:11px 15px;
  border-radius:8px;
  font-weight:bold;
}

.hero{
  background:#111;
  color:white;
  text-align:center;
  padding:40px 15px;
}

.hero h1{
  color:#d4af37;
  font-size:40px;
  letter-spacing:6px;
  margin-bottom:10px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.search input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:18px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:20px;
}

.category{
  background:white;
  border:1px solid #ddd;
  padding:11px 20px;
  border-radius:25px;
  font-weight:bold;
  white-space:nowrap;
}

.category.active{
  background:#111;
  color:#d4af37;
}

.title{
  text-align:center;
  margin:10px 0 22px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:15px;
  padding:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product-image{
  height:220px;
  background:#eee;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:13px;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.no-image{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

.product h3{
  margin-bottom:7px;
}

.description{
  color:#777;
  margin-bottom:8px;
}

.price{
  color:#b08b00;
  font-size:21px;
  font-weight:bold;
  margin-bottom:7px;
}

.stock{
  color:#666;
  font-size:14px;
  margin-bottom:10px;
}

.add{
  width:100%;
  background:#111;
  color:white;
  border:0;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
}

.add:disabled{
  background:#aaa;
}

footer{
  margin-top:50px;
  background:#111;
  color:#aaa;
  text-align:center;
  padding:25px;
}

@media(max-width:600px){

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product{
    padding:10px;
  }

  .product-image{
    height:180px;
  }

  .product h3{
    font-size:16px;
  }

  .price{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">RONQA</div>

    <button class="cart-button">
      🛒 السلة
    </button>
  </div>
</header>

<section class="hero">
  <h1>RONQA</h1>
  <p>منتجات مميزة بأسعار مناسبة</p>
</section>

<div class="container">

  <div class="search">
    <input
      id="search"
      type="text"
      placeholder="🔎 ابحث عن منتج..."
    >
  </div>

  <div class="categories">

    <button
      class="category active"
      onclick="setCategory('all',this)">
      الكل
    </button>

    <button
      class="category"
      onclick="setCategory('bags',this)">
      👜 حقائب
    </button>

    <button
      class="category"
      onclick="setCategory('shoes',this)">
      👟 أحذية
    </button>

    <button
      class="category"
      onclick="setCategory('accessories',this)">
      ⌚ إكسسوارات
    </button>

  </div>

  <h2 class="title">
    🛍️ منتجاتنا
  </h2>

  <div id="products" class="products">

    <div style="
      grid-column:1/-1;
      text-align:center;
      padding:40px;">
      جاري تحميل المنتجات...
    </div>

  </div>

</div>

<footer>
© 2026 RONQA
</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qpctjcaygybpanzyweso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p_iM1Wod_z9W0kfBXAC90w_J8tH85fO";


let products = [];

let selectedCategory = "all";


/* =========================
   تحديد التصنيف
========================= */

function getCategory(value){

  const text = String(value || "")
    .trim()
    .toLowerCase();

  if(
    text.includes("حق")
  ){
    return "bags";
  }

  if(
    text.includes("حذ") ||
    text.includes("احذ") ||
    text.includes("أحذ")
  ){
    return "shoes";
  }

  if(
    text.includes("كسسو") ||
    text.includes("اكسسو") ||
    text.includes("إكسسو")
  ){
    return "accessories";
  }

  return "other";
}


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

  const box =
    document.getElementById("products");

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/Products?select=*",
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "البيانات غير صحيحة"
      );

    }


    products = data;

    showProducts(products);

  }

  catch(error){

    console.error(error);

    box.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:40px;
      ">

        <h3>
        ❌ حدث خطأ في تحميل المنتجات
        </h3>

        <p style="
          margin-top:10px;
          color:#777;
          direction:ltr;
        ">
        ${error.message}
        </p>

      </div>
    `;

  }

}


/* =========================
   عرض المنتجات
========================= */

function showProducts(list){

  const box =
    document.getElementById("products");

  box.innerHTML = "";


  if(list.length === 0){

    box.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:40px;
      ">
        لا توجد منتجات في هذا التصنيف.
      </div>
    `;

    return;
  }


  list.forEach(product=>{

    const id =
      product.id;

    const name =
      product.name || "منتج";

    const description =
      product.description || "";

    const price =
      Number(product.price) || 0;

    const stock =
      Number(product.stock) || 0;

    const image =
      String(product.image_url || "").trim();


    let imageHTML = "";


    if(image){

      imageHTML = `
        <img
          src="${image}"
          alt="${name}"
          loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        >

        <div
          class="no-image"
          style="display:none">
          🛍️
        </div>
      `;

    }else{

      imageHTML = `
        <div class="no-image">
          🛍️
        </div>
      `;

    }


    box.innerHTML += `

      <div class="product">

        <div class="product-image">
          ${imageHTML}
        </div>

        <h3>
          ${escapeHTML(name)}
        </h3>

        <p class="description">
          ${escapeHTML(description)}
        </p>

        <div class="price">
          ${price.toLocaleString("fr-DZ")} دج
        </div>

        <div class="stock">
          📦 المخزون: ${stock}
        </div>

        <button
          class="add"
          onclick="addToCart(${id})"
          ${stock <= 0 ? "disabled" : ""}>

          ${
            stock <= 0
            ? "غير متوفر"
            : "🛒 أضف إلى السلة"
          }

        </button>

      </div>

    `;

  });

}


/* =========================
   التصنيف
========================= */

function setCategory(category,button){

  selectedCategory =
    category;


  document
    .querySelectorAll(".category")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  button.classList.add("active");


  filterProducts();

}


/* =========================
   فلترة
========================= */

function filterProducts(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const result =
    products.filter(product=>{

      const category =
        getCategory(
          product.category
        );


      const name =
        String(
          product.name || ""
        ).toLowerCase();


      const description =
        String(
          product.description || ""
        ).toLowerCase();


      const categoryOK =
        selectedCategory === "all" ||
        category === selectedCategory;


      const searchOK =
        name.includes(search) ||
        description.includes(search);


      return (
        categoryOK &&
        searchOK
      );

    });


  showProducts(result);

}


/* =========================
   البحث
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    filterProducts
  );


/* =========================
   زر السلة
========================= */

function addToCart(id){

  const product =
    products.find(
      p =>
      Number(p.id) ===
      Number(id)
    );


  if(!product){
    return;
  }


  alert(
    "تم اختيار المنتج: " +
    product.name
  );

}


/* =========================
   حماية النص
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   تشغيل الموقع
========================= */

loadProducts();

</script>

</body>
</html>
