<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RONQA | متجر إلكتروني</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f6;
color:#222;
}

header{
background:#111;
color:white;
padding:18px 15px;
position:sticky;
top:0;
z-index:100;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
color:#d4af37;
font-size:32px;
font-weight:bold;
letter-spacing:5px;
}

.logo small{
display:block;
font-size:9px;
color:#ddd;
letter-spacing:3px;
text-align:center;
margin-top:4px;
}

.cart-btn{
background:#d4af37;
border:0;
border-radius:9px;
padding:11px 16px;
font-weight:bold;
cursor:pointer;
}

.hero{
background:#111;
color:white;
text-align:center;
padding:45px 15px;
}

.hero h1{
font-size:40px;
color:#d4af37;
letter-spacing:5px;
margin-bottom:10px;
}

.hero p{
color:#ddd;
}

.container{
max-width:1100px;
margin:auto;
padding:30px 15px;
}

.search{
margin-bottom:25px;
}

.search input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;
}

.title{
text-align:center;
margin-bottom:25px;
font-size:28px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.image{
width:100%;
height:220px;
background:#eee;
border-radius:12px;
overflow:hidden;
margin-bottom:15px;
}

.image img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.no-image{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.product h3{
font-size:20px;
margin-bottom:8px;
}

.description{
color:#777;
margin-bottom:10px;
min-height:35px;
}

.price{
font-size:21px;
font-weight:bold;
color:#b08b00;
margin-bottom:7px;
}

.stock{
font-size:14px;
color:#666;
margin-bottom:12px;
}

.add{
width:100%;
background:#111;
color:white;
border:0;
padding:13px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.add:hover{
background:#d4af37;
color:#111;
}

.cart{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:420px;
height:100vh;
background:white;
z-index:300;
transition:.3s;
display:flex;
flex-direction:column;
box-shadow:-5px 0 20px rgba(0,0,0,.2);
}

.cart.open{
right:0;
}

.cart-head{
background:#111;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.cart-head h2{
color:#d4af37;
}

.close{
background:none;
border:0;
color:white;
font-size:25px;
cursor:pointer;
}

.cart-list{
flex:1;
overflow-y:auto;
padding:15px;
}

.cart-item{
border-bottom:1px solid #ddd;
padding:15px 0;
}

.cart-name{
font-weight:bold;
margin-bottom:7px;
}

.cart-price{
color:#b08b00;
font-weight:bold;
margin-bottom:10px;
}

.qty{
display:flex;
align-items:center;
gap:10px;
}

.qty button{
width:32px;
height:32px;
border:0;
background:#111;
color:white;
border-radius:6px;
cursor:pointer;
}

.delete{
margin-right:auto;
background:#c00 !important;
}

.cart-bottom{
padding:18px;
border-top:1px solid #ddd;
background:#fafafa;
}

.total{
font-size:21px;
font-weight:bold;
margin-bottom:12px;
}

.whatsapp-order{
display:block;
background:#25D366;
color:white;
text-align:center;
padding:14px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}

.clear{
width:100%;
margin-top:8px;
padding:10px;
border:0;
border-radius:8px;
cursor:pointer;
}

.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:250;
}

.overlay.show{
display:block;
}

.contact{
background:#111;
color:white;
text-align:center;
padding:35px 15px;
margin-top:50px;
}

.whatsapp{
display:inline-block;
margin-top:15px;
background:#25D366;
color:white;
padding:13px 25px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}

footer{
text-align:center;
padding:25px;
color:#777;
}

@media(max-width:600px){

.logo{
font-size:27px;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.product{
padding:10px;
}

.image{
height:180px;
}

.product h3{
font-size:17px;
}

.price{
font-size:18px;
}

.add{
font-size:12px;
padding:11px 5px;
}

.cart{
max-width:100%;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
RONQA
<small>DESERT STORE</small>
</div>

<button class="cart-btn" onclick="openCart()">
🛒 السلة (<span id="count">0</span>)
</button>

</div>

</header>


<section class="hero">

<h1>RONQA</h1>

<p>منتجات مميزة بأسعار مناسبة</p>

</section>


<div class="container">

<div class="search">

<input
id="search"
type="text"
placeholder="🔎 ابحث عن منتج..."
>

</div>

<h2 class="title">
🛍️ منتجاتنا
</h2>

<div class="products" id="products">

<div style="text-align:center;grid-column:1/-1;">
جاري تحميل المنتجات...
</div>

</div>

</div>


<!-- CART -->

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cart" id="cart">

<div class="cart-head">

<h2>🛒 السلة</h2>

<button class="close" onclick="closeCart()">×</button>

</div>

<div class="cart-list" id="cartList"></div>

<div class="cart-bottom">

<div class="total" id="total">
المجموع: 0 دج
</div>

<a
id="whatsappOrder"
class="whatsapp-order"
href="#"
target="_blank">

💬 إرسال الطلب عبر WhatsApp

</a>

<button
class="clear"
onclick="clearCart()">

🗑️ تفريغ السلة

</button>

</div>

</div>


<section class="contact">

<h2>📞 للطلب والاستفسار</h2>

<p style="margin-top:10px;">
تواصل معنا عبر WhatsApp
</p>

<a
class="whatsapp"
href="https://wa.me/213675996957"
target="_blank">

💬 WhatsApp

</a>

</section>


<footer>
© 2026 RONQA - جميع الحقوق محفوظة
</footer>


<script>

const SUPABASE_URL =
"https://qpctjcaygybpanzyweso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p_iM1Wod_z9W0kfBXAC90w_J8tH85fO";


let products=[];

let cart=[];


const productsBox =
document.getElementById("products");


async function loadProducts(){

try{

const response=await fetch(

`${SUPABASE_URL}/rest/v1/Products?select=*`,

{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}

);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


products=await response.json();

showProducts(products);

}

catch(error){

productsBox.innerHTML=`

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
color:red;">

حدث خطأ في تحميل المنتجات

<br><br>

${error.message}

</div>

`;

}

}


function showProducts(list){

productsBox.innerHTML="";


if(!list.length){

productsBox.innerHTML=`

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;">

لا توجد منتجات

</div>

`;

return;

}


list.forEach(product=>{


const name=
product.name || "منتج";


const description=
product.description || "";


const price=
Number(product.price)||0;


const stock=
Number(product.stock)||0;


const image=
String(product.image_url||"").trim();


let imageHTML;


if(image){

imageHTML=`

<img
src="${image}"
alt="${name}"
>

<div
class="no-image"
style="display:none;">

🛍️

</div>

`;

}else{

imageHTML=`

<div class="no-image">
🛍️
</div>

`;


}


productsBox.innerHTML+=`

<div class="product">

<div class="image">

${imageHTML}

</div>

<h3>
${name}
</h3>

<p class="description">
${description}
</p>

<div class="price">
${price} دج
</div>

<div class="stock">
📦 متوفر: ${stock}
</div>

<button
class="add"
onclick="addToCart(${product.id})"
${stock<=0?"disabled":""}>

🛒 أضف إلى السلة

</button>

</div>

`;

});

}


function addToCart(id){

const product=
products.find(
p=>Number(p.id)===Number(id)
);


if(!product)return;


const stock=
Number(product.stock)||0;


const existing=
cart.find(
p=>Number(p.id)===Number(id)
);


if(existing){

if(existing.quantity<stock){

existing.quantity++;

}else{

alert("لا يمكن تجاوز الكمية المتوفرة");

}

}else{

cart.push({

id:product.id,

name:product.name,

price:Number(product.price)||0,

stock:stock,

quantity:1

});

}


updateCart();

openCart();

}


function updateCart(){

const list=
document.getElementById("cartList");


const count=
document.getElementById("count");


const totalBox=
document.getElementById("total");


list.innerHTML="";


let total=0;

let number=0;


cart.forEach((item,index)=>{


const subtotal=
item.price*item.quantity;


total+=subtotal;

number+=item.quantity;


list.innerHTML+=`

<div class="cart-item">

<div class="cart-name">
${item.name}
</div>

<div class="cart-price">
${item.price} دج
</div>

<div class="qty">

<button
onclick="changeQty(${index},-1)">
−
</button>

<span>
${item.quantity}
</span>

<button
onclick="changeQty(${index},1)">
+
</button>

<button
class="delete"
onclick="removeItem(${index})">
🗑️
</button>

</div>

<div style="margin-top:8px;">
المجموع:
${subtotal} دج
</div>

</div>

`;

});


if(!cart.length){

list.innerHTML=`

<div style="
text-align:center;
padding:40px;
color:#777;">

السلة فارغة 🛒

</div>

`;

}


count.innerText=number;

totalBox.innerText=
"المجموع: "+total+" دج";


updateWhatsApp();

}


function changeQty(index,value){

const item=cart[index];

if(!item)return;


const newQty=
item.quantity+value;


if(newQty<=0){

removeItem(index);

return;

}


if(newQty>item.stock){

alert("لا يمكن تجاوز المخزون");

return;

}


item.quantity=newQty;

updateCart();

}


function removeItem(index){

cart.splice(index,1);

updateCart();

}


function clearCart(){

cart=[];

updateCart();

}


function updateWhatsApp(){

let message=
"السلام عليكم، أريد طلب:%0A%0A";


let total=0;


cart.forEach(item=>{

const subtotal=
item.price*item.quantity;


total+=subtotal;


message+=
"• "+item.name+
" × "+item.quantity+
" = "+subtotal+" دج%0A";

});


message+=
"%0Aالمجموع: "+total+" دج";


document.getElementById(
"whatsappOrder"
).href=
"https://wa.me/213675996957?text="
+message;

}


function openCart(){

document
.getElementById("cart")
.classList.add("open");

document
.getElementById("overlay")
.classList.add("show");

}


function closeCart(){

document
.getElementById("cart")
.classList.remove("open");

document
.getElementById("overlay")
.classList.remove("show");

}


document
.getElementById("search")
.addEventListener(
"input",
function(){

const text=
this.value.toLowerCase().trim();


const filtered=
products.filter(product=>{

const name=
String(product.name||"")
.toLowerCase();

const description=
String(product.description||"")
.toLowerCase();


return(
name.includes(text)||
description.includes(text)
);

});


showProducts(filtered);

});


loadProducts();

updateCart();

</script>

</body>
</html>
