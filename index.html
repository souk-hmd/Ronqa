<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">

    <meta name="description"
          content="RONQA dz STORE - متجر إلكتروني لبيع المنتجات في الجزائر">

    <title>RONQA dz STORE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        RONQA
        <small>dz STORE</small>
    </div>

    <button
        type="button"
        class="cart-button"
        onclick="openCart()"
        aria-label="فتح سلة المشتريات">

        🛒 السلة

        <span id="cartCount">0</span>

    </button>

</header>


<section class="search-section">

    <input
        type="search"
        id="search"
        placeholder="🔎 ابحث عن منتج..."
        autocomplete="off">

</section>


<section
    class="categories"
    aria-label="تصنيفات المنتجات">

    <button
        type="button"
        class="category active"
        onclick="setCategory('all', this)">

        الكل

    </button>

    <button
        type="button"
        class="category"
        onclick="setCategory('bags', this)">

        👜 حقائب

    </button>

    <button
        type="button"
        class="category"
        onclick="setCategory('shoes', this)">

        👟 أحذية

    </button>

    <button
        type="button"
        class="category"
        onclick="setCategory('accessories', this)">

        💎 إكسسوارات

    </button>

</section>


<main>

    <div id="products" class="products">

        <div class="loading">

            ⏳ جاري تحميل المنتجات...

        </div>

    </div>

</main>


<div
    id="overlay"
    class="overlay"
    onclick="closeCart()">
</div>


<aside
    id="cartPanel"
    class="cart-panel"
    aria-label="سلة المشتريات">

    <div class="cart-header">

        <h2>
            🛒 سلة المشتريات
        </h2>

        <button
            type="button"
            onclick="closeCart()"
            aria-label="إغلاق السلة">

            ✕

        </button>

    </div>


    <div
        id="cartList"
        class="cart-list">

        <div class="empty-cart">

            السلة فارغة 🛒

        </div>

    </div>


    <div id="total" class="total">

        <div>

            <span>
                🛍️ مجموع المنتجات
            </span>

            <strong id="productsTotal">
                0 دج
            </strong>

        </div>


        <div>

            <span>
                🚚 التوصيل
            </span>

            <strong id="deliveryPrice">
                اختر الولاية
            </strong>

        </div>


        <div class="final-row">

            <span>
                💰 المجموع النهائي
            </span>

            <strong id="finalTotal">
                0 دج
            </strong>

        </div>

    </div>


    <div class="order-form">

        <h3>
            📦 معلومات التوصيل
        </h3>


        <input
            type="text"
            id="customerName"
            placeholder="👤 الاسم واللقب"
            autocomplete="name">


        <input
            type="tel"
            id="customerPhone"
            placeholder="📞 رقم الهاتف"
            autocomplete="tel"
            inputmode="tel">


        <select id="wilaya">

            <option value="">
                📍 اختر الولاية
            </option>

        </select>


        <select id="city" disabled>

            <option value="">
                🏙️ اختر المدينة / البلدية
            </option>

        </select>


        <input
            type="text"
            id="address"
            placeholder="🏠 العنوان بالتفصيل"
            autocomplete="street-address">


        <textarea
            id="note"
            placeholder="📝 ملاحظة (اختياري)"
            rows="3"></textarea>


        <button
            type="button"
            class="send-order"
            onclick="sendOrder()">

            📲 تأكيد الطلب عبر WhatsApp

        </button>


        <button
            type="button"
            class="clear-cart"
            onclick="clearCart()">

            🗑️ إفراغ السلة

        </button>

    </div>

</aside>


<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
