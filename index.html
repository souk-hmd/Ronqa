<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RONQA</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f6;
color:#222;
}

header{
background:#111;
color:white;
padding:16px;
position:sticky;
top:0;
z-index:100;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
color:#d4af37;
font-size:30px;
font-weight:bold;
letter-spacing:5px;
}

.cart-button{
background:#d4af37;
border:0;
padding:11px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.hero{
background:#111;
color:white;
text-align:center;
padding:40px 15px;
}

.hero h1{
color:#d4af37;
font-size:40px;
letter-spacing:6px;
margin-bottom:10px;
}

.container{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

.search input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
margin-bottom:18px;
outline:none;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:20px;
}

.category{
background:white;
border:1px solid #ddd;
padding:11px 20px;
border-radius:25px;
font-weight:bold;
white-space:nowrap;
cursor:pointer;
}

.category.active{
background:#111;
color:#d4af37;
}

.title{
text-align:center;
margin-bottom:22px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
border-radius:15px;
padding:14px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product-image{
height:220px;
background:#eee;
border-radius:12px;
overflow:hidden;
margin-bottom:13px;
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.no-image{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.product h3{
margin-bottom:7px;
}

.description{
color:#777;
margin-bottom:8px;
}

.price{
color:#b08b00;
font-size:21px;
font-weight:bold;
margin-bottom:7px;
}

.stock{
color:#666;
font-size:14px;
margin-bottom:10px;
}

.add{
width:100%;
background:#111;
color:white;
border:0;
padding:12px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.add:disabled{
background:#aaa;
}

.size-box{
margin-bottom:10px;
}

.size-box select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
background:white;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:200;
}

.overlay.show{
display:block;
}

.cart-panel{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:450px;
height:100vh;
background:white;
z-index:300;
transition:.3s;
display:flex;
flex-direction:column;
}

.cart-panel.open{
right:0;
}

.cart-header{
background:#111;
color:white;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.cart-header h2{
color:#d4af37;
}

.close-cart{
background:none;
border:0;
color:white;
font-size:28px;
cursor:pointer;
}

.cart-list{
flex:1;
overflow-y:auto;
padding:15px;
}

.cart-item{
border-bottom:1px solid #ddd;
padding:14px 0;
}

.cart-item-name{
font-weight:bold;
margin-bottom:6px;
}

.cart-item-price{
color:#b08b00;
font-weight:bold;
margin-bottom:8px;
}

.quantity{
display:flex;
align-items:center;
gap:8px;
}

.quantity button{
width:32px;
height:32px;
border:0;
border-radius:6px;
background:#111;
color:white;
font-size:18px;
}

.remove{
margin-right:auto;
background:#c00 !important;
}

.customer-form{
padding:12px;
border-top:1px solid #ddd;
overflow-y:auto;
max-height:45vh;
}

.customer-form h3{
margin-bottom:10px;
}

.customer-form input,
.customer-form select,
.customer-form textarea{
width:100%;
padding:10px;
margin-bottom:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
background:white;
}

.customer-form textarea{
height:55px;
resize:none;
}

.delivery-title{
font-weight:bold;
margin:8px 0;
}

.delivery-box{
display:flex;
gap:8px;
margin-bottom:10px;
}

.delivery-option{
flex:1;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
text-align:center;
cursor:pointer;
background:white;
}

.delivery-option.active{
background:#111;
color:#d4af37;
border-color:#111;
}

.delivery-price{
background:#f5f5f5;
padding:10px;
border-radius:8px;
margin-bottom:8px;
font-weight:bold;
}

.cart-bottom{
padding:12px;
border-top:1px solid #ddd;
background:#fafafa;
}

.total-products,
.delivery-total,
.final-total{
margin-bottom:7px;
}

.final-total{
font-size:22px;
font-weight:bold;
color:#b08b00;
margin-bottom:10px;
}

.whatsapp{
width:100%;
background:#25D366;
color:white;
border:0;
padding:14px;
border-radius:9px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.clear{
width:100%;
margin-top:7px;
padding:9px;
border:0;
border-radius:8px;
cursor:pointer;
}

footer{
margin-top:50px;
background:#111;
color:#aaa;
text-align:center;
padding:25px;
}

.loading{
grid-column:1/-1;
text-align:center;
padding:40px;
}

.error{
grid-column:1/-1;
text-align:center;
padding:40px;
color:#c00;
}

@media(max-width:600px){

.products{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.product{
padding:10px;
}

.product-image{
height:180px;
}

.product h3{
font-size:16px;
}

.price{
font-size:18px;
}

.add{
font-size:12px;
}

.cart-panel{
max-width:100%;
}

.customer-form{
max-height:42vh;
}

}

</style>
</head>

/* =========================
CATEGORY
========================= */

function getCategory(value){

const text =
String(value || "")
.trim()
.toLowerCase();

if(text.includes("حق")){
return "bags";
}

if(
text.includes("حذ") ||
text.includes("احذ") ||
text.includes("أحذ")
){
return "shoes";
}

if(
text.includes("كسسو") ||
text.includes("اكسسو") ||
text.includes("إكسسو")
){
return "accessories";
}

return "other";

}


/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML = `
<div class="loading">
⏳ جاري الاتصال بالمتجر...
</div>
`;

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/Products?select=*",
{
method:"GET",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
}
}
);

if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}

const data =
await response.json();

if(!Array.isArray(data)){

throw new Error(
"البيانات غير صحيحة"
);

}

products = data;

showProducts(products);

}
catch(error){

console.error(error);

box.innerHTML = `

<div class="error">

❌ لم نتمكن من تحميل المنتجات.

<br><br>

<button
onclick="loadProducts()"
style="
padding:12px 20px;
border:0;
border-radius:8px;
background:#111;
color:white;
cursor:pointer;">

🔄 إعادة المحاولة

</button>

</div>

`;

}

}


/* =========================
SHOW PRODUCTS
========================= */

function showProducts(list){

const box =
document.getElementById("products");

box.innerHTML = "";

if(!list || list.length === 0){

box.innerHTML = `

<div class="loading">

لا توجد منتجات في هذا التصنيف.

</div>

`;

return;

}

list.forEach(product=>{

const id = product.id;

const name =
product.name || "منتج";

const description =
product.description || "";

const price =
Number(product.price) || 0;

const stock =
Number(product.stock) || 0;

const image =
String(product.image_url || "").trim();

const category =
getCategory(product.category);

let imageHTML = "";

if(image){

imageHTML = `

<img
src="${escapeHTML(image)}"
alt="${escapeHTML(name)}"
loading="lazy"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='flex';
">

<div
class="no-image"
style="display:none">

🛍️

</div>

`;

}else{

imageHTML = `

<div class="no-image">
🛍️
</div>

`;

}

let sizeHTML = "";

if(category === "shoes"){

sizeHTML = `

<div class="size-box">

<select id="size-${id}">

<option value="">
اختر المقاس
</option>

<option value="36">36</option>
<option value="37">37</option>
<option value="38">38</option>
<option value="39">39</option>
<option value="40">40</option>
<option value="41">41</option>
<option value="42">42</option>
<option value="43">43</option>
<option value="44">44</option>
<option value="45">45</option>

</select>

</div>

`;

}

box.innerHTML += `

<div class="product">

<div class="product-image">

${imageHTML}

</div>

<h3>
${escapeHTML(name)}
</h3>

<p class="description">
${escapeHTML(description)}
</p>

<div class="price">
${price.toLocaleString("fr-DZ")} دج
</div>

<div class="stock">
📦 المخزون: ${stock}
</div>

${sizeHTML}

<button
class="add"
onclick="addToCart(${Number(id)})"
${stock <= 0 ? "disabled" : ""}>

${
stock <= 0
? "غير متوفر"
: "🛒 أضف إلى السلة"
}

</button>

</div>

`;

});

}


/* =========================
CATEGORY FILTER
========================= */

function setCategory(category,button){

selectedCategory =
category;

document
.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

filterProducts();

}


/* =========================
FILTER
========================= */

function filterProducts(){

const search =
document
.getElementById("search")
.value
.trim()
.toLowerCase();

const result =
products.filter(product=>{

const category =
getCategory(product.category);

const name =
String(product.name || "")
.toLowerCase();

const description =
String(product.description || "")
.toLowerCase();

return (

(selectedCategory === "all" ||
category === selectedCategory)

&&

(
name.includes(search) ||
description.includes(search)
)

);

});

showProducts(result);

}


/* =========================
SEARCH
========================= */

document
.getElementById("search")
.addEventListener(
"input",
filterProducts
);


/* =========================
ADD TO CART
========================= */

function addToCart(id){

const product =
products.find(
p => Number(p.id) === Number(id)
);

if(!product){
return;
}

const category =
getCategory(product.category);

let size = "";

if(category === "shoes"){

const select =
document.getElementById("size-"+id);

if(!select || !select.value){

alert("اختر مقاس الحذاء أولاً");

return;

}

size = select.value;

}

const existing =
cart.find(item =>
Number(item.id) === Number(id)
&&
item.size === size
);

if(existing){

if(
existing.quantity >=
Number(product.stock)
){

alert("وصلت للكمية المتوفرة");

return;

}

existing.quantity++;

}else{

cart.push({

id:id,

name:product.name,

price:Number(product.price) || 0,

stock:Number(product.stock) || 0,

size:size,

quantity:1

});

}

updateCart();

openCart();

}


/* =========================
UPDATE CART
========================= */

function updateCart(){

const list =
document.getElementById("cartList");

const count =
document.getElementById("cartCount");

list.innerHTML = "";

let total = 0;

let itemCount = 0;

cart.forEach((item,index)=>{

const subtotal =
item.price * item.quantity;

total += subtotal;

itemCount += item.quantity;

list.innerHTML += `

<div class="cart-item">

<div class="cart-item-name">

${escapeHTML(item.name)}

</div>

${

/* =========================
CHANGE QUANTITY
========================= */

function changeQuantity(index,change){

const item =
cart[index];

if(!item)return;

const newQuantity =
item.quantity + change;

if(newQuantity <= 0){

removeItem(index);

return;

}

if(newQuantity > item.stock){

alert("لا توجد كمية كافية في المخزون");

return;

}

item.quantity =
newQuantity;

updateCart();

}


/* =========================
REMOVE
========================= */

function removeItem(index){

cart.splice(index,1);

updateCart();

}


/* =========================
CLEAR
========================= */

function clearCart(){

cart = [];

updateCart();

}
