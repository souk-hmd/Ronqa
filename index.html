<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RONQA</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f6;
color:#222;
}

header{
background:#111;
color:white;
padding:16px;
position:sticky;
top:0;
z-index:100;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
color:#d4af37;
font-size:30px;
font-weight:bold;
letter-spacing:5px;
}

.cart-button{
background:#d4af37;
border:0;
padding:11px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.hero{
background:#111;
color:white;
text-align:center;
padding:40px 15px;
}

.hero h1{
color:#d4af37;
font-size:40px;
letter-spacing:6px;
margin-bottom:10px;
}

.container{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

.search input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
margin-bottom:18px;
outline:none;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:20px;
}

.category{
background:white;
border:1px solid #ddd;
padding:11px 20px;
border-radius:25px;
font-weight:bold;
white-space:nowrap;
cursor:pointer;
}

.category.active{
background:#111;
color:#d4af37;
}

.title{
text-align:center;
margin-bottom:22px;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
border-radius:15px;
padding:14px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product-image{
height:220px;
background:#eee;
border-radius:12px;
overflow:hidden;
margin-bottom:13px;
}

.product-image img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.no-image{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

.product h3{
margin-bottom:7px;
}

.description{
color:#777;
margin-bottom:8px;
}

.price{
color:#b08b00;
font-size:21px;
font-weight:bold;
margin-bottom:7px;
}

.stock{
color:#666;
font-size:14px;
margin-bottom:10px;
}

.add{
width:100%;
background:#111;
color:white;
border:0;
padding:12px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.add:disabled{
background:#aaa;
}

.size-box{
margin-bottom:10px;
}

.size-box select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
background:white;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:200;
}

.overlay.show{
display:block;
}

.cart-panel{
position:fixed;
top:0;
right:-100%;
width:100%;
max-width:450px;
height:100vh;
background:white;
z-index:300;
transition:.3s;
display:flex;
flex-direction:column;
}

.cart-panel.open{
right:0;
}

.cart-header{
background:#111;
color:white;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.cart-header h2{
color:#d4af37;
}

.close-cart{
background:none;
border:0;
color:white;
font-size:28px;
cursor:pointer;
}

.cart-list{
flex:1;
overflow-y:auto;
padding:15px;
}

.cart-item{
border-bottom:1px solid #ddd;
padding:14px 0;
}

.cart-item-name{
font-weight:bold;
margin-bottom:6px;
}

.cart-item-price{
color:#b08b00;
font-weight:bold;
margin-bottom:8px;
}

.quantity{
display:flex;
align-items:center;
gap:8px;
}

.quantity button{
width:32px;
height:32px;
border:0;
border-radius:6px;
background:#111;
color:white;
font-size:18px;
}

.remove{
margin-right:auto;
background:#c00 !important;
}

.customer-form{
padding:12px;
border-top:1px solid #ddd;
}

.customer-form h3{
margin-bottom:10px;
}

.customer-form input,
.customer-form select,
.customer-form textarea{
width:100%;
padding:10px;
margin-bottom:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
background:white;
}

.customer-form textarea{
height:55px;
resize:none;
}

.delivery-box{
background:#f8f4df;
border:1px solid #e5d28a;
padding:12px;
border-radius:10px;
margin-top:5px;
margin-bottom:8px;
}

.delivery-row{
display:flex;
justify-content:space-between;
margin-bottom:6px;
}

.delivery-row:last-child{
margin-bottom:0;
font-weight:bold;
font-size:18px;
}

.cart-bottom{
padding:12px;
border-top:1px solid #ddd;
background:#fafafa;
}

.total{
font-size:21px;
font-weight:bold;
margin-bottom:10px;
}

.whatsapp{
width:100%;
background:#25D366;
color:white;
border:0;
padding:14px;
border-radius:9px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.clear{
width:100%;
margin-top:7px;
padding:9px;
border:0;
border-radius:8px;
cursor:pointer;
}

footer{
margin-top:50px;
background:#111;
color:#aaa;
text-align:center;
padding:25px;
}

@media(max-width:600px){

.products{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.product{
padding:10px;
}

.product-image{
height:180px;
}

.product h3{
font-size:16px;
}

.price{
font-size:18px;
}

.add{
font-size:12px;
}

.cart-panel{
max-width:100%;
}

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
RONQA
</div>

<button
class="cart-button"
onclick="openCart()">

🛒 السلة
(<span id="cartCount">0</span>)

</button>

</div>

</header>


<section class="hero">

<h1>RONQA</h1>

<p>
منتجات مميزة بأسعار مناسبة
</p>

</section>


<div class="container">

<div class="search">

<input
id="search"
type="text"
placeholder="🔎 ابحث عن منتج..."
>

</div>


<div class="categories">

<button
class="category active"
onclick="setCategory('all',this)">

الكل

</button>

<button
class="category"
onclick="setCategory('bags',this)">

👜 حقائب

</button>

<button
class="category"
onclick="setCategory('shoes',this)">

👟 أحذية

</button>

<button
class="category"
onclick="setCategory('accessories',this)">

⌚ إكسسوارات

</button>

</div>


<h2 class="title">
🛍️ منتجاتنا
</h2>


<div
id="products"
class="products">

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;">

جاري تحميل المنتجات...

</div>

</div>

</div>


<div
id="overlay"
class="overlay"
onclick="closeCart()">
</div>


<div
id="cartPanel"
class="cart-panel">


<div class="cart-header">

<h2>
🛒 السلة
</h2>

<button
class="close-cart"
onclick="closeCart()">

×

</button>

</div>


<div
id="cartList"
class="cart-list">
</div>


<div class="customer-form">

<h3>
📋 معلومات الطلب
</h3>


<input
id="customerName"
type="text"
placeholder="👤 اسم الزبون"
>


<input
id="customerPhone"
type="tel"
placeholder="📞 رقم الهاتف"
>


<select id="wilaya">

<option value="">
📍 جاري تحميل الولايات...
</option>

</select>


<select id="city" disabled>

<option value="">
🏙️ اختر الولاية أولاً
</option>

</select>


<input
id="address"
type="text"
placeholder="🏠 العنوان"
>


<textarea
id="note"
placeholder="📝 ملاحظة اختيارية">
</textarea>


<div
class="delivery-box">

<div class="delivery-row">

<span>
🚚 التوصيل
</span>

<strong id="deliveryPrice">
0 دج
</strong>

</div>


<div class="delivery-row">

<span>
💰 المجموع النهائي
</span>

<strong id="grandTotal">
0 دج
</strong>

</div>

</div>


</div>


<div class="cart-bottom">

<div
id="total"
class="total">

المجموع: 0 دج

</div>


<button
class="whatsapp"
onclick="sendOrder()">

💬 إرسال الطلب عبر WhatsApp

</button>


<button
class="clear"
onclick="clearCart()">

🗑️ تفريغ السلة

</button>

</div>


</div>


<footer>

© 2026 RONQA

</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qpctjcaygybpanzyweso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p_iM1Wod_z9W0kfBXAC90w_J8tH85fO";


/* =========================
   ALGERIA LOCATION DATA
========================= */

const WILAYA_API =
"https://mohamed-gp.github.io/algeria_69_wilayas/main.json";

const COMMUNE_API =
"https://mohamed-gp.github.io/algeria_69_wilayas/communes.json";


/* =========================
   DELIVERY PRICES
   مؤقتة وقابلة للتعديل
========================= */

const DEFAULT_DELIVERY = 800;

const DELIVERY_PRICES = {

"الجزائر":900,
"وهران":900,
"قسنطينة":850,
"عنابة":850,
"سطيف":800,
"باتنة":800,
"بسكرة":750,
"الوادي":700,
"ورقلة":700,
"تقرت":700,
"المغير":700,
"المنيعة":700,
"غرداية":700,
"الأغواط":750,
"الجلفة":750,
"المسيلة":800,
"بومرداس":900,
"البليدة":900,
"تيبازة":900,
"تيزي وزو":900

};


let products = [];

let cart = [];

let selectedCategory = "all";

let wilayasData = [];

let communesData = [];


/* =========================
   CATEGORY
========================= */

function getCategory(value){

const text =
String(value || "")
.trim()
.toLowerCase();

if(text.includes("حق")){
return "bags";
}

if(
text.includes("حذ") ||
text.includes("احذ") ||
text.includes("أحذ")
){
return "shoes";
}

if(
text.includes("كسسو") ||
text.includes("اكسسو") ||
text.includes("إكسسو")
){
return "accessories";
}

return "other";

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

const box =
document.getElementById("products");

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/Products?select=*",

{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY
}
}

);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


products =
await response.json();


showProducts(products);

}

catch(error){

console.error(error);

box.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;">

❌ حدث خطأ في تحميل المنتجات

</div>

`;

}

}


/* =========================
   SHOW PRODUCTS
========================= */

function showProducts(list){

const box =
document.getElementById("products");

box.innerHTML = "";


if(list.length === 0){

box.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;">

لا توجد منتجات في هذا التصنيف.

</div>

`;

return;

}


list.forEach(product=>{

const id =
product.id;

const name =
product.name || "منتج";

const description =
product.description || "";

const price =
Number(product.price) || 0;

const stock =
Number(product.stock) || 0;

const image =
String(product.image_url || "").trim();

const category =
getCategory(product.category);


let imageHTML = "";


if(image){

imageHTML = `

<img
src="${image}"
alt="${escapeHTML(name)}"
loading="lazy"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='flex';
">

<div
class="no-image"
style="display:none">

🛍️

</div>

`;

}else{

imageHTML = `

<div class="no-image">
🛍️
</div>

`;

}


let sizeHTML = "";


if(category === "shoes"){

sizeHTML = `

<div class="size-box">

<select id="size-${id}">

<option value="">
اختر المقاس
</option>

<option value="36">36</option>
<option value="37">37</option>
<option value="38">38</option>
<option value="39">39</option>
<option value="40">40</option>
<option value="41">41</option>
<option value="42">42</option>
<option value="43">43</option>
<option value="44">44</option>
<option value="45">45</option>

</select>

</div>

`;

}


box.innerHTML += `

<div class="product">

<div class="product-image">

${imageHTML}

</div>


<h3>
${escapeHTML(name)}
</h3>


<p class="description">
${escapeHTML(description)}
</p>


<div class="price">

${price.toLocaleString("fr-DZ")}
دج

</div>


<div class="stock">

📦 المخزون:
${stock}

</div>


${sizeHTML}


<button
class="add"
onclick="addToCart(${id})"
${stock <= 0 ? "disabled" : ""}>

${
stock <= 0
? "غير متوفر"
: "🛒 أضف إلى السلة"
}

</button>


</div>

`;

});

}


/* =========================
   CATEGORY FILTER
========================= */

function setCategory(category,button){

selectedCategory =
category;

document
.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});

button.classList.add("active");

filterProducts();

}


/* =========================
   FILTER
========================= */

function filterProducts(){

const search =
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const result =
products.filter(product=>{

const category =
getCategory(product.category);

const name =
String(product.name || "")
.toLowerCase();

const description =
String(product.description || "")
.toLowerCase();


return (

(selectedCategory === "all" ||
category === selectedCategory)

&&

(
name.includes(search) ||
description.includes(search)
)

);

});


showProducts(result);

}


/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener(
"input",
filterProducts
);


/* =========================
   LOAD WILAYAS
========================= */

async function loadLocations(){

const wilayaSelect =
document.getElementById("wilaya");

const citySelect =
document.getElementById("city");

try{

const [
wilayaResponse,
communeResponse
] = await Promise.all([

fetch(WILAYA_API),

fetch(COMMUNE_API)

]);


if(
!wilayaResponse.ok ||
!communeResponse.ok
){

throw new Error(
"Location API error"
);

}


const wilayaJSON =
await wilayaResponse.json();

const communeJSON =
await communeResponse.json();


wilayasData =
wilayaJSON.wilayas || [];

communesData =
communeJSON.communes || [];


wilayaSelect.innerHTML = `

<option value="">
📍 اختر الولاية
</option>

`;


wilayasData
.sort((a,b)=>Number(a.id)-Number(b.id))
.forEach(wilaya=>{

const option =
document.createElement("option");

option.value =
wilaya.id;

option.textContent =
wilaya.name_ar;

wilayaSelect.appendChild(option);

});


citySelect.disabled = true;

citySelect.innerHTML = `

<option value="">
🏙️ اختر الولاية أولاً
</option>

`;


}catch(error){

console.error(error);

wilayaSelect.innerHTML = `

<option value="">
❌ تعذر تحميل الولايات
</option>

`;

}

}


/* =========================
   WILAYA CHANGE
========================= */

document
.getElementById("wilaya")
.addEventListener(
"change",
function(){

const wilayaId =
this.value;

const citySelect =
document.getElementById("city");

citySelect.innerHTML = `

<option value="">
🏙️ اختر البلدية
</option>

`;


if(!wilayaId){

citySelect.disabled = true;

updateCart();

return;

}


const selectedCommunes =
communesData.filter(
commune =>
String(commune.wilaya_id) ===
String(wilayaId)
);


if(selectedCommunes.length === 0){

citySelect.innerHTML = `

<option value="">
لا توجد بلديات
</option>

`;

citySelect.disabled = true;

return;

}


selectedCommunes
.sort((a,b)=>
String(a.name_ar)
.localeCompare(
String(b.name_ar),
"ar"
)
)
.forEach(commune=>{

const option =
document.createElement("option");

option.value =
commune.name_ar;

option.textContent =
commune.name_ar;

citySelect.appendChild(option);

});


citySelect.disabled = false;

updateCart();

}
);


/* =========================
   GET WILAYA NAME
========================= */

function getWilayaName(){

const select =
document.getElementById("wilaya");

if(!select.value){

return "";

}

const wilaya =
wilayasData.find(
w =>
String(w.id) ===
String(select.value)
);

return wilaya
? wilaya.name_ar
: "";

}


/* =========================
   DELIVERY
========================= */

function getDeliveryPrice(){

const wilaya =
getWilayaName();

if(!wilaya){

return 0;

}

return Number(
DELIVERY_PRICES[wilaya]
) || DEFAULT_DELIVERY;

}


/* =========================
   CART PRODUCTS TOTAL
========================= */

function getProductsTotal(){

let total = 0;

cart.forEach(item=>{

total +=
item.price *
item.quantity;

});

return total;

}


/* =========================
   UPDATE TOTAL
========================= */

function updateTotals(){

const productsTotal =
getProductsTotal();

const delivery =
cart.length
? getDeliveryPrice()
: 0;

const grandTotal =
productsTotal +
delivery;


document.getElementById(
"total"
).innerText =
"المنتجات: " +
productsTotal.toLocaleString("fr-DZ") +
" دج";


document.getElementById(
"deliveryPrice"
).innerText =
delivery.toLocaleString("fr-DZ") +
" دج";


document.getElementById(
"grandTotal"
).innerText =
grandTotal.toLocaleString("fr-DZ") +
" دج";

}


/* =========================
   ADD TO CART
========================= */

function addToCart(id){

const product =
products.find(
p =>
Number(p.id) === Number(id)
);


if(!product)return;


const category =
getCategory(product.category);


let size = "";


if(category === "shoes"){

const select =
document.getElementById(
"size-"+id
);


if(!select.value){

alert(
"اختر مقاس الحذاء أولاً"
);

return;

}

size =
select.value;

}


const existing =
cart.find(item=>

Number(item.id) === Number(id)
&&
item.size === size

);


if(existing){

if(
existing.quantity >=
Number(product.stock)
){

alert(
"وصلت للكمية المتوفرة"
);

return;

}

existing.quantity++;

}else{

cart.push({

id:id,

name:product.name,

price:Number(product.price)||0,

stock:Number(product.stock)||0,

size:size,

quantity:1

});

}


updateCart();

openCart();

}


/* =========================
   UPDATE CART
========================= */

function updateCart(){

const list =
document.getElementById("cartList");

const count =
document.getElementById("cartCount");


list.innerHTML = "";


let itemCount = 0;


cart.forEach((item,index)=>{

itemCount +=
item.quantity;


const subtotal =
item.price *
item.quantity;


list.innerHTML += `

<div class="cart-item">

<div class="cart-item-name">

${escapeHTML(item.name)}

</div>


${
item.size
?
`<div>
📏 المقاس: ${item.size}
</div>`
:
""
}


<div class="cart-item-price">

${item.price.toLocaleString("fr-DZ")}
دج

</div>


<div class="quantity">

<button
onclick="changeQuantity(${index},-1)">
−
</button>


<span>
${item.quantity}
</span>


<button
onclick="changeQuantity(${index},1)">
+
</button>


<button
class="remove"
onclick="removeItem(${index})">

🗑️

</button>

</div>


<div style="
margin-top:6px;
font-weight:bold;">

المجموع الفرعي:
${subtotal.toLocaleString("fr-DZ")}
دج

</div>


</div>

`;

});


if(cart.length === 0){

list.innerHTML = `

<div style="
text-align:center;
padding:40px;
color:#777;">

السلة فارغة 🛒

</div>

`;

}


count.innerText =
itemCount;


updateTotals();

}


/* =========================
   QUANTITY
========================= */

function changeQuantity(index,change){

const item =
cart[index];

if(!item)return;


const newQuantity =
item.quantity + change;


if(newQuantity <= 0){

removeItem(index);

return;

}


if(newQuantity > item.stock){

alert(
"لا توجد كمية كافية في المخزون"
);

return;

}


item.quantity =
newQuantity;


updateCart();

}


/* =========================
   REMOVE
========================= */

function removeItem(index){

cart.splice(index,1);

updateCart();

}


/* =========================
   CLEAR
========================= */

function clearCart(){

cart = [];

updateCart();

}


/* =========================
   OPEN CART
========================= */

function openCart(){

document
.getElementById("cartPanel")
.classList.add("open");

document
.getElementById("overlay")
.classList.add("show");

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

document
.getElementById("cartPanel")
.classList.remove("open");

document
.getElementById("overlay")
.classList.remove("show");

}
